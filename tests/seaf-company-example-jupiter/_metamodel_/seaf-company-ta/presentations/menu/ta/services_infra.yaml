entities:
  seaf.company.ta.services.storages:
    menu: >
      (
        $entity_id := "seaf.company.ta.services.storages";
        $domain_id := "seaf.company.ta";
        $root_menu := $seaf_fn_get_root_menu($."seaf.configs", $domain_id);
        $root_menu_order := $seaf_fn_get_root_menu_order($."seaf.configs", $domain_id);
        $menu := $seaf_fn_generate_menu_item("Сервисы/Инфраструктура/Хранилища", $root_menu);
        $edit_menu := $seaf_fn_generate_menu_item("Сервисы/Инфраструктура/Хранилища/Изменение хранилищ", $root_menu);
        $legacy_id := "seaf.ta.services.storage";
        $legacy := $lookup($, $legacy_id);
        $has_objects := $exists($lookup($, $entity_id));
        $has_legacy := $exists($legacy) and $count($keys($legacy)) > 0;
        $items := [];
        $items := ($has_objects or $has_legacy)
          ? $append($items, {
              "link": "/entities/" & $entity_id & "/list",
              "location": $menu,
              "order": $root_menu_order + 190
            })
          : $items;
        $items
      )

