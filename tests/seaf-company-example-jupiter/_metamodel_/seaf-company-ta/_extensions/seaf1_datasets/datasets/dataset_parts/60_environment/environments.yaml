# Назначение: Подготовка датасета `seaf.company.ds.ta.environments` (environments) в контуре seaf1_datasets.
# Используется: compat-слой seaf1 -> seaf2 (подключается по необходимости через extension root).
# SEAF1 counterpart of seaf.company.ds.ta.environments
datasets:
  seaf.company.ds.ta.environments:
    description: |
      Окружения (prod/dev/test)
    origin:
      by_entities: seaf.ds.objects_by_entities
      data_lake: ($)
    source: >
      (
        $seaf2 := $exists(by_entities."seaf.company.ta.services.environments") ? by_entities."seaf.company.ta.services.environments" : {};
        $list := data_lake."seaf.ta.services.environment";
        $seaf1 := $exists($list)
          ? $each($list, function($val, $key) {
              {
                $key: $merge([
                  $val,
                  {
                    "__id__": $key,
                    "__entity_id__": "seaf.company.ta.services.environments",
                    "__entity_id": $key,
                    "__object_type": "seaf.company.ta.services.environments"
                  }
                ])
              }
            }) ~> $merge()
          : {};
        $merge([$seaf2, $seaf1])
      )
