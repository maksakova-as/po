entities:
  seaf.company.ta.services.dc_offices:

    presentations:
      dc_office_card_details:
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        type: table
        headers:
          - value: field
            text: Атрибут
          - value: value
            text: Значение
            link: link
        origin:
          offices: seaf.company.ds.ta.dc_offices
          regions: seaf.company.ds.ta.dc_regions
        source: >
          (
            $office := $lookup(offices, $params.id);
            $region := $exists($office) ? $lookup(regions, $office.region) : {};
            $exists($office)
              ? [
                  {"field": "ID", "value": $office.__id__},
                  {"field": "Название", "value": $office.title},
                  {"field": "Описание", "value": $office.description},
                  {"field": "Адрес", "value": $office.address},
                  {
                    "field": "Регион",
                    "value": $region.title,
                    "link": $exists($region) ? "/entities/" & $region.__entity_id__ & "/card?id=" & $region.__id__ : null
                  },
                  {"field": "Внешний ID", "value": $office.external_id}
                ]
              : []
          )

      dc_office_topology:
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        type: plantuml
        template: templates/server_location.puml
        origin:
          offices: seaf.company.ds.ta.dc_offices
          regions: seaf.company.ds.ta.dc_regions
        source: >
          (
            $office := $lookup(offices, $params.id);
            $region := $exists($office.region) ? $lookup(regions, $office.region) : {};
            $has_office := $exists($office.__id__);
            $base := "@startuml\n" &
              "skinparam backgroundColor #ffffff\n" &
              "skinparam defaultTextAlignment center\n" &
              "skinparam shadowing false\n" &
              "skinparam rectangle {\n" &
              "  BackgroundColor #f2f4f7\n" &
              "  BorderColor #4d6bf0\n" &
              "  FontColor #111318\n" &
              "}\n" &
              "skinparam node {\n" &
              "  BackgroundColor #fdfdfd\n" &
              "  BorderColor #4d6bf0\n" &
              "  FontColor #111318\n" &
              "}\n" &
              "skinparam arrowColor #4d6bf0\n" &
              "skinparam arrowFontColor #111318\n" &
              "skinparam note {\n" &
              "  BackgroundColor #fff8e1\n" &
              "  BorderColor #f0a500\n" &
              "  FontColor #382100\n" &
              "}\n" &
              (
                $exists($region.__id__)
                  ? "node \"Регион: [[/entities/" & $region.__entity_id__ & "/card?id=" & $region.__id__ & " " & $region.title & "]]\" as region_node #bbdefb\n"
                  : ""
              ) &
              (
                $has_office
                  ? "node \"Локация: [[/entities/" & $office.__entity_id__ & "/card?id=" & $office.__id__ & " " & $office.title & "]]\" as office_node #d1c4e9\n"
                  : ""
              );
            $diagram_core :=
              ($exists($region.__id__) and $has_office ? "region_node --> office_node\n" : "");
            $diagram :=
              $has_office
                ? ($base & $diagram_core & "@enduml")
                : "@startuml\nnote \"Локация не найдена\" as no_office\n@enduml";
            {
              "diagram": $diagram
            }
          )

      header:
        type: markdown
        template: ../../../seaf-company-base/_shared/templates/header.md
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            /*  ищем объект для презентации */
            $obj2present := $lookup(objects, $params.id);
            {
              "entity": $obj2present.__entity_title__,
              "title": $obj2present.title
            }
          )
