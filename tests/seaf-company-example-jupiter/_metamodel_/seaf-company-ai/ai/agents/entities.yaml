entities:
  seaf.company.ai.agents:
    title: &entity_title ИИ Агенты
    description: &entity_description >
      ИИ Агент - это система на базе генеративного искусственного интеллекта, способная планировать и совершать автономные действия
      во внешней среде, реагировать на изменения и взаимодействовать с человеком и другими агентами для достижения поставленных целей.
      \n Используйте ключ (идентификатор) объекта вида: 
      \n - <компания>.ai_agent.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    objects:
      agent:
        route: "/"
        title: ИИ Агент
        symbol: "ai_agent"

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          # additionalProperties: false
          # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
          # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.def.lifecycle_stage"
            - $ref: "#/$defs/seaf.company.def.ai.stakeholders"
            - $ref: "#/$defs/seaf.company.def.ai.business_usages"

          properties:
            activity:
              title: ИИ-инициатива
              description: >
                ИИ-инициатива компании, в рамках которой разрабатывается агент.
                Выбирайте инициативу из справочника инициатив\задач или введите свое название
              anyOf:
                - type: string
                  anyOf:
                    - $ref: "#/$rels/seaf.company.change.activities.activity" # если используется метамодель SEAF2
                    - $ref: "#/$rels/kadzo.v2023.tasks.tasks" # если используется метамодель КА ДЗО
                - type: string
                  minLength: 3

            criticality_level:
              title: Уровень критичности
              description: >
                Оцененный уровень критичности ИИ-агента. Оценка производится аналогично оценке уровней критичности для
                автоматизированных систем
              enum:
                - Mission Critical Plus
                - Mission Critical
                - Business Critical
                - Business Operational
                - Office Productivity

            capabilities:
              title: Способности ИИ-агента
              description: >
                Способности \ навыки, которыми обладает агент, роли которые он может играть, обеспечивающие ту ценность, 
                которую ожидают потребители от данного ИИ-агента.
                Например: Консультант по финансам, Поиск запрошенных данных, Тренер по программированию, 
                Юридическая экспертиза договоров покупки недвижимости
                \nЕсли способности не определены, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  items:
                    type: string

            models:
              title: Модели
              description: >
                Обработка и генерация данных, логический вывод, принятие решений.
                Модель является "мозгом" AI-агента, и отвечает за:
                \n- понимание входных данных (промптов)
                \n- планирование действий и выбор инструментов (tools)
                \n- генерацию ответов
                \nЕсли модели не используются, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.def.lifecycle_stage"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    properties:
                      model:
                        title: Ссылка на модель
                        description: Выберите id-модели из справочника либо введите название модели
                        anyOf:
                          - type: string
                            $ref: "#/$rels/seaf.company.ai.models.ai_model"
                          - type: string
                            minLength: 3
                      description:
                        title: Описание
                        description: Описание предназначения, сценария \ алгоритма работы модели в составе агента
                        type: string
                    required:
                      - model
                      - description

            memory:
              title: Память
              description: >
                Механизм реализации памяти агента, используемый для хранения и извлечения информации
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    properties:
                      type:
                        title: Тип
                        description: >
                          Память AI-агента может быть нескольких типов:
                          \n- Кратковременная (short-term). Содержит контекст текущего диалога или сессии
                          \n- Долговременная (long-term). Содержит информацию, которая остается актуальной и ценной за пределами отдельного диалога или сессии
                          \n- Эпизодическая. Содержит конкретные примеры выполнения задач для обучения на опыте
                        enum:
                          - Долговременная память
                          - Кратковременная память
                          - Эпизодическая память
                    required:
                      - type

            domain_knowledge:
              title: Знания предметной области
              description: >
                Механизмы дообогащения "знаний" агента данными предметной области 
                с целью сфокусировать ИИ-модель на специфике конкретного домена \ области деятельности
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    properties:
                      type:
                        title: Тип
                        description: >
                          Выберите значение из справочника. Если не найдено подходящее - введите свой текст
                        anyOf:
                          - type: string
                            enum:
                              - RAG
                          - type: string
                    required:
                      - type

            tools:
              title: Инструменты
              description: >
                Расширение возможностей AI-агента путём вызова внешних по отношению к нему сервисов и функций (в том числе вызов внешних API).
                Решение о том, когда и какой инструмент (tool) использовать, принимает Модель
                \nЕсли инструменты не используются, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                    properties:
                      type:
                        title: Тип
                        description: >
                          Тип определяет подход как именно реализована функция (инструмент) для агента. Либо это встроенный в тело агента код, 
                          выполняющий всю работу (внутренняя логика), либо это вызов внешних по отношению к агенту функций
                          (прямые вызовы API и баз данных, вызов по протоколу MCP или подобным),
                          либо это вызов другого ИИ-агента
                          \nВыберите значение из справочника. Если не найдено подходящее - введите свой текст
                        anyOf:
                          - type: string
                            enum:
                              - Внутренняя логика
                              - Прямой вызов API
                              - Прямое взаимодействие с БД
                              - MCP функция
                              - Вызов ИИ-агента
                          - type: string
                            minLength: 3
                      realized_in:
                        title: Реализуется в
                        description: |
                          Значение задается в зависимости от типа инструмента:
                          \n -тип "Внутренняя логика" - указываем систему, в которой логика реализована (основная система агента)
                          \n -тип "Прямой вызов API" - указываем систему - поставщика API
                          \n -тип "Прямое взаимодействие с БД" - указываем систему, к которой относится БД
                          \n -тип "MCP функция" - указываем систему, где реализован MCP сервер для данной функции
                          \n -тип "Вызов ИИ-агента" - указываем ИИ-агента, который вызывается
                          \n -тип пользовательский - указываем систему, в которой реализована основная логика данного инструмента
                        $ref: "#/$defs/seaf.company.def.ai.realized_in_refs"

                    required:
                      - type
                      - description

            control_flows:
              title: Потоки исполнения
              description: >
                Организация действий AI-агента до достижения цели.
                AI-агент получает цель, выполняет шаги, проверяет критерии достижения цели. 
                Если результат неудовлетворителен, то повторяет шаги с новыми параметрами.
                \nЕсли потоки не используются, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    required:
                      - description

            feedbacks:
              title: Обратная связь
              description: >
                Оценка результатов работы AI-агента (человеком или на основе автоматических метрик, рефлексии и интроспекции). 
                Данный функциональный блок ответственен за улучшение качества работы AI-агента
                \nЕсли обратная связь не используется, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    properties:
                      type:
                        title: Тип
                        description: >
                          \n- Оценка человеком - качество работы агента оценивается экспертом
                          \n- Рефлексия (Reflection) - способность AI-агента оценивать свои действия и корректировать свой подход к достижению цели.
                          AI-агент может анализировать свои действия и их результаты, распознавать ситуации, 
                          когда его стратегии неэффективны и соответствующим образом менять своё поведение, 
                          адаптируясь к изменению контекста или окружающей среды.
                          \n- Интроспекция (Introspection) - способность AI-агента изучать и анализировать свои когнитивные 
                          процессы, понимать и объяснять принятые решения
                          \nВыберите значение из справочника. Если не найдено подходящее - введите свой текст
                        anyOf:
                          - type: string
                            enum:
                              - Оценка человеком
                              - Рефлексия
                              - Интроспекция
                          - type: string
                            minLength: 3
                    required:
                      - type

            guardrails:
              title: Защитные ограничения
              description: >
                Контроль поведения AI-агентов с целью обеспечения безопасности и предсказуемости поведения
                 \nЕсли защита не используется, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    properties:
                      type:
                        title: Тип
                        description: >
                          \nВыберите значение из справочника. Если не найдено подходящее - введите свой текст
                          \n- Классификатор релевантности - отклоняет промпты не по теме
                          \n- Фильтр безопасности - защищает от инъекций в промпты
                          \n- Модерация - фильтрует токсичный контент
                          \n- Управление рисками - идентификация и минимизация потенциальных рисков, связанных с использованием AI, включая механизмы для быстрого реагирования на инциденты
                          \n- Ограничения по длине промптов и контента
                          \n- Валидация ответа — проверка соответствия теме, тону общения 
                          \n- Ограничение нагрузки (запросов пользователей)
                          \n- Проверка запросов к AI-агенту на соответствие цели AI-агента
                          \n- Фильтр ПДн - проверяет на утечку персональных данных 
                          \n- Контроль структуры и форматов вызовов инструментов (tools) из AI-агента
                        anyOf:
                          - type: string
                            enum:
                              - Классификатор релевантности
                              - Фильтр безопасности
                              - Модерация
                              - Управление рисками
                              - Ограничения по длине промптов и контента
                              - Валидация ответа
                              - Ограничение нагрузки (запросов пользователей)
                              - Проверка запросов к AI-агенту на соответствие цели AI-агента
                              - Фильтр ПДн
                              - Контроль структуры и форматов вызовов инструментов (tools) из AI-агента
                          - type: string
                            minLength: 3
                    required:
                      - type

            input_interfaces:
              title: Входящие интерфейсы
              description: >
                Взаимодействие клиентов (человека, других AI-агентов, Автоматизированных Систем и т.д.) с данным AI-агентом
                 \nЕсли вх. интерфейсы не используются, то явно укажите опцию "Не используется"
              oneOf:
                - $ref: "#/$defs/seaf.company.def.ai.not_used"
                - type: array
                  minItems: 1
                  items:
                    type: object
                    # additionalProperties: false
                    # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                    # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                    allOf:
                      - $ref: "#/$defs/seaf.company.def.ai.basic_attributes"
                      - $ref: "#/$defs/seaf.company.def.ai.realized_in"
                    properties:
                      type:
                        title: Тип
                        description: >
                          Тип интерфейса
                          \nВыберите значение из справочника. Если не найдено подходящее - введите свой текст
                        anyOf:
                          - type: string
                            enum:
                              - API
                              - GUI
                          - type: string
                            minLength: 3
                    required:
                      - type
                      - description

            ai_stack:
              title: ИИ стек
              description: >
                Набор элементов ИИ стека (фрейвморки, библиотеки, облачные решения), задействованных для построения агента
              type: array
              minItems: 1
              items:
                type: object
                # additionalProperties: false
                # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                allOf:
                  - $ref: "#/$defs/seaf.company.def.ai.delivery_type"
                properties:
                  description:
                    title: Описание
                    description: Описание предназначения использования технологии в составе агента
                    type: string

                  technology:
                    title: Технология
                    description: >
                      ИИ Технология, использованная в ИИ агенте
                      \nВыберите значение из справочника. Если не найдено подходящее - введите свой текст
                    anyOf:
                      - type: string
                        enum:
                          - Giga Agent Builder (Sber)
                          - Agent Navigator (Sber)
                          - langflow
                          - flowise
                          - N8N
                          - Dify
                          - LangChain
                          - Camel
                          - AutoGPT
                          - LlamaIndex
                          - Milvus
                          - Qdrant
                          - Chroma
                          - PG Vector
                          - FAISS
                      - type: string
                        minLength: 3

                  build_type:
                    title: Способ создания
                    description: >
                      Способ реализации поведения агента с использованием указанной технологии:
                      \n- Low code, No code - Без программирования 
                      \n- Code based - Путем программирования
                    type: string
                    enum:
                      - Low code, No code
                      - Code based
                required:
                  - build_type
                  - delivery_type
                  - description
          required:
            - capabilities
            - criticality_level
            - business_usages
            - models
            - memory
            - tools
            - control_flows
            - feedbacks
            - guardrails
            - input_interfaces
            - ai_stack

