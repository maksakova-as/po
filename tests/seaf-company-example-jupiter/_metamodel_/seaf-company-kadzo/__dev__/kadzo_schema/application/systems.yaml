entities:
  kadzo.v2023.systems:
    title: Системы
    description: Автоматизированная система - самостоятельный объект управления в ИТ-процессах, представляющий собой набор разработанных или заимствованных компонентов Программного Обеспечения, реализующих логически связанный набор функциональности для выполнения необходимых бизнес-задач, а также для поддержки других АС. Функциональная подсистема - Дополнительный к АС объект управления в ИТ-процессах, представляющий собой совокупность компонентов ПО, реализующую логически связанное подмножество функциональности АС. В контексте КА ДЗО функциональная подсистема обладает такими же характеристиками, как и АС
    schema:
      $defs:
        kadzo.v2023.systems.ownership:
          title: Модель владения
          type: object
          properties:
            location:
              title: Размещение
              enum:
                - Внутренняя
                - Внешняя
            ownership:
              title: Степень владения
              enum:
                - Владеем исходным кодом
                - Владеем экземпляром
                - SaaS
                - Система партнера
            group:
              title: Группа систем
              $ref: "#/$rels/kadzo.v2023.groups.groups"
        kadzo.v2023.systems.lifestage:
          title: Управление жизненным циклом объекта
          type: object
          properties:
            live-stage:
              title: Этап жизненного цикла (текущий)
              enum:
                - Эскиз
                - В разработке / приобретение
                - Внедрение / Не введена в эксплуатацию
                - Опытная эксплуатация
                - Промышленная эксплуатация
                - Архивная
                - Отменена
#            live-stage-target:
#              title: Этап жизненного цикла на горизонт планирования
#              enum:
#                - Эскиз
#                - В разработке / приобретение
#                - Внедрение / Не введена в эксплуатацию
#                - Опытная эксплуатация
#                - Промышленная эксплуатация
#                - Архивная
#                - Отменена
            target-status:
              title: Целевой статус (решение принято)
              enum:
                - Целевая
                - Не целевая
            change-type:
              title: Тип изменений
              enum:
                - Планируется
                - Разрабатывается
                - Модифицируется
                - Используется
                - Выводится из эксплуатации
            changes:
              title: Описание изменений
              type: string
        kadzo.v2023.systems.performance:
          title: Параметры производительности и надежности
          type: object
          properties:
            performance:
              title: Производительность
              type: string
            rto:
              title: RTO (час)
              type: integer
            rpo:
              title: RPO (час)
              type: integer
            sla:
              title: Уровень доступности
              type: integer
            monitoring:
              title: Средства мониторинга
              type: string
        kadzo.v2023.systems.service_management:
          title: Параметры сервисного обслуживания
          type: object
          properties:
            ihci:
              title: Идентификатор IHCI в ITSM
              type: string
      type: object
      patternProperties:
        "[a-zA-Z0-9_]*(\\.[a-zA-Z0-9_]*)*$":
          type: object
          allOf:
            - $ref: "#/$defs/kadzo.v2023.systems.ownership"
            - $ref: "#/$defs/kadzo.v2023.systems.lifestage"
            - $ref: "#/$defs/kadzo.v2023.systems.performance"
            - $ref: "#/$defs/kadzo.v2023.systems.service_management"
            - $ref: "#/$defs/kadzo.includes.softwares"
            - $ref: "#/$defs/kadzo.ta_props.scalability"
            - $ref: "#/$defs/kadzo.ta_props.ha"
            - $ref: "#/$defs/kadzo.ta_props.dr"
            - $ref: "#/$defs/kadzo.ta_props.backup"
            - if:
                properties:
                  criticality:
                    enum: ["Business Critical", "Mission Critical", "Mission Critical Plus"]
                  location:
                    enum: ["Внутренняя"]
                  live-stage:
                    enum: ['В разработке / приобретение', 'Внедрение / Не введена в эксплуатацию', 'Опытная эксплуатация', 'Промышленная эксплуатация', 'Архивная']
                required:
                  - criticality
                  - location
                  - live-stage
              then:
                required:
                  - high_availability
                  - disaster_recovery
                  - scalability
                  - backup
            - if:
                properties:
                  ownership:
                    enum: ['Владеем исходным кодом', 'Владеем экземпляром', 'SaaS']
                  live-stage:
                    enum: ['В разработке / приобретение', 'Внедрение / Не введена в эксплуатацию', 'Опытная эксплуатация', 'Промышленная эксплуатация', 'Архивная']
                required:
                  - ownership
                  - live-stage
              then:
                required:
                  - softwares
          properties:
            title:
              title: Наименование
              type: string
              minLength: 2
            description:
              title: Описание
              type: string
              minLength: 2
            parent:
              title: ID родительской АС (для ФП)
              $ref: "#/$rels/kadzo.v2023.systems.systems"
            class:
              title: Класс
              enum:
                - Каналы обслуживания клиентов (фронтальные решения)
                - ИИ-агент
                - LLM-приложение
                - Мультиагентная система
                - BPM (Business Process Management)
                - CRM-аналитический
                - CRM-операционный
                - ECM (Документооборот)
                - RPA (Robotic process automation)
                - Workforce Management
                - Аналитика данных
                - Бизнес-планирование
                - Биллинг
                - Бухгалтерия и финансы
                - Бюджетирование и контроль
                - Взаимоотношения с поставщиками
                - Гео-информационные системы
                - Клиентский профиль (Customer Information File)
                - Корпоративная база знаний
                - Корпоративная отчетность
                - Корпоративный портал
                - Маркетинг
                - Маркетплейс компании
                - Нормативная документация
                - Обмен данными с контрагентами
                - Получение сведений о юрлицах
                - Продуктовая фабрика (основная деятельность)
                - Продуктовый каталог
                - Регуляторная отчетность
                - Сайт компании
                - Системы принятия решений
                - Скоринг и рейтинг клиентов
                - Совместная работа (collaboration)
                - Управление активами
                - Управление внутрихозяйственной деятельностью
                - Управление задачами и проектами
                - Управление обучением
                - Управление персоналом
                - Учет судебных дел
                - Финансовый мониторинг и AML
                - CMS (Content Management System)
                - MDM (Master Data Management)
                - Системы генерации документов
                - ИБ-Антивирусное ПО
                - ИБ-Аудит действий персонала
                - ИБ-Аутентификация пользователей
                - ИБ-Биометрия
                - ИБ-Защита от киберугроз
                - ИБ-Защита от сетевых атак
                - ИБ-Защита от утечек информации
                - ИБ-Защита трафика
                - ИБ-Криптография и шифрование
                - ИБ-Предотвращение мошенничества
                - ИБ-Управление доступом
                - ИБ-Управление сертификатами
                - ИБ-Управление событиями инф.безопасности
                - Средства коммуникации
                - Средства (инструменты) управления разработкой и хранения кода
                - Системы резервного/архивного копирования
                - Системы логирования
                - Средства мониторинга
                - Средства управления и автоматизации
                - Инфраструктура удаленного доступа
                - Средства управления ИТ-службой, ИТ-инфраструктурой и ИТ-активами
                - Сервера/кластеры серверов приложений
                - Шлюзы, Балансировщики, Proxy
                - Файловый ресурс
                - Интеграционная шина
                - Системы управления большими данными и аналитической обработки больших объёмов данных
                - СУБД
                - Кэш, распределенный кеш
                - Иное
            criticality:
              title: Уровень критичности
              enum:
                - Mission Critical Plus
                - Mission Critical
                - Business Critical
                - Business Operational
                - Office Productivity
            comments:
              title: Комментарии, риски, проблемы
              type: string
          required:
            - title
            - description
            - class
    objects:
      systems:
        route: "/"
        title: Системы
        symbol: "sys"