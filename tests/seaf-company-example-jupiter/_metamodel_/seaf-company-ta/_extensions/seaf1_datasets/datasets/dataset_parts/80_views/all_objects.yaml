          dc_regions,
          dc_azs,
          dcs,
          dc_offices,
          networks,
          network_segments,
          cluster_virtualizations,
          storages,
          k8s,
          backup,
          monitoring,
          kb,
          network_links,
          logical_links,
          environments,
          stands,
          software,
          hw_storages,
          servers,
          network_components,
          user_devices,
          k8s_namespaces,
          k8s_deployments,
          k8s_hpas,
          k8s_nodes
