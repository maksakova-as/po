        origin: seaf.company.ds.cybersec.systems
        source: >
          (
          $.*@$val.{
              "id": $val.__id__,
              "link": "/entities/" & $val.__entity_id__ & "/card?id=" & $val.__id__,
              "title": $val.title,
              "class": $val.class,
          /*    "criticality_level": $val.criticality_level,*/
