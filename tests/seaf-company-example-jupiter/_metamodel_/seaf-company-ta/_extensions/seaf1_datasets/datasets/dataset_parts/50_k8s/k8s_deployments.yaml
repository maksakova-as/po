# Назначение: Подготовка датасета `seaf.company.ds.ta.k8s_deployments` (k8s deployments) в контуре seaf1_datasets.
# Используется: compat-слой seaf1 -> seaf2 (подключается по необходимости через extension root).
# SEAF1 counterpart of seaf.company.ds.ta.k8s_deployments
datasets:
  seaf.company.ds.ta.k8s_deployments:
    description: |
      Kubernetes deployments
    origin:
      by_entities: seaf.ds.objects_by_entities
      data_lake: ($)
    source: >
      (
        $seaf2 := $exists(by_entities."seaf.company.ta.services.k8s_deployments") ? by_entities."seaf.company.ta.services.k8s_deployments" : {};
        $list := data_lake."seaf.ta.components.k8s_deployment";
        $seaf1 := $exists($list)
          ? $each($list, function($val, $key) {
              {
                $key: $merge([
                  $val,
                  {
                    "__id__": $key,
                    "__entity_id__": "seaf.company.ta.services.k8s_deployments",
                    "__entity_id": $key,
                    "__object_type": "seaf.company.ta.services.k8s_deployments"
                  }
                ])
              }
            }) ~> $merge()
          : {};
        $merge([$seaf2, $seaf1])
      )
