rules:
  validators:
    seaf.validation.ta.environments.stand_existence:
      uid: SEAF-TA-EXIST-STAND
      title: Проверка наличия Стенда (stand)
      description: |
        Проверяет, что в архитектуре описан хотя бы один Стенд (seaf.company.ta.services.stand).
      correction: |
        Убедитесь, что в файлах архитектуры (`/architecture/ta/`) создан
        хотя бы один объект типа `seaf.company.ta.services.stand`.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.environments.stand_existence";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                $count($.datasets."seaf.company.ds.ta.stands") = 0 ? {
                    "uid": "seaf.validation.ta.existence.stand",
                    "title": "Отсутствует описание Стенда (stand)",
                    "correction": "ID: " & "seaf.validation.ta.existence.stand" & ". " & ("Необходимо описать хотя бы один Стенд (seaf.company.ta.services.stand) в архитектуре."),
                    "description": "В архитектуре не описано ни одного Стенда."
                }
              ])
            )
            : []
        )
