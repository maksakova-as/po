entities:
  seaf.company.cybersec.systems:

    presentations:
      # Встраиваемся в презентацию карточки
      card:
        widgets:
          functions:
            title: Реализует функции
            # Идентификатор презентации, которая будет использоваться в виджете
            presentation: functions
            # Расположение
            align: "v"
            # Порядок расположения
            order: 400
            # Определяем стиль виджета
            style:
              margin: 4px
              padding: 0px
              border: true

      # Презентация для виджета
      functions:
        params:
          type: object
          properties:
            id:
              title: Идентификатор объекта
              type: string
          required:
            - id

        type: table
        headers:
          - value: number
            text: №
          - value: function
            text: Функция
            link: function_link
          - value: description
            text: Описание
          - value: service
            text: Публикуется через сервис
            link: service_link
          - value: lifecycle_stage
            text: Этап ЖЦ

        origin:
          objects: seaf.company.ds.cybersec.systems
          all_objects: seaf.ds.objects
        source: >
          (
          $objects := objects;
          $all_objects := all_objects;
          $id := $params.id;
          $obj2present := $objects.$lookup($id);
          $lcs := $obj2present.lifecycle_stage;
          $data2present := $obj2present.realizes_functions;
          $exists($data2present) and  $data2present != null
          ? $map($data2present, function($val, $i) {(
              $f := $exists($val."function") ? $seaf_fn_get_object_info($val."function", $all_objects);
              $s := $exists($val.service) ? $seaf_fn_get_object_info($val.service, $all_objects);
              {
                "number": $i+1,
                "function": $f.title,
                "function_link": $f.link_to_card,
                "description": $val.description,
                "service": $s.title,
                "service_link": $s.link_to_card,
                "lifecycle_stage": $exists($val.lifecycle_stage) ? $val.lifecycle_stage : $lcs
              }
            )})[];
          )