      k8s_details:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: field
            text: Атрибут
          - value: value
            text: Значение
            link: link
        origin:
          k8s: seaf.company.ds.ta.k8s
          azs: seaf.company.ds.ta.dc_azs
          dcs: seaf.company.ds.ta.dcs
          offices: seaf.company.ds.ta.dc_offices
        source: >
          (
            $obj := $lookup(k8s, $params.id);
            $azs := azs;
            $dcs := dcs;
            $offices := offices;
            $resolve_location := function($id){
              $lookup($dcs, $id) ? $lookup($dcs, $id) : $lookup($offices, $id)
            };
            $az_rows := $exists($obj.availabilityzone)
              ? $obj.availabilityzone[].(
                  $az := $lookup($azs, $);
                  {
                    "field": "Зона доступности",
                    "value": $az.title,
                    "link": $exists($az) ? "/entities/" & $az.__entity_id__ & "/card?id=" & $az.__id__ : null
                  }
                )
              : [];
            $loc_rows := $exists($obj.location)
              ? $obj.location[].(
                  $loc := $resolve_location($);
                  {
                    "field": "Локация",
                    "value": $loc.title,
                    "link": $exists($loc) ? "/entities/" & $loc.__entity_id__ & "/card?id=" & $loc.__id__ : null
                  }
                )
              : [];
            $exists($obj)
              ? [
                  {"field": "ID", "value": $obj.__id__},
                  {"field": "Название", "value": $obj.title},
                  {"field": "Описание", "value": $obj.description},
                  {"field": "FQDN", "value": $obj.fqdn},
                  {"field": "Версия/ПО", "value": $obj.software},
                  {"field": "CNI", "value": $obj.cni},
                  {"field": "Service mesh", "value": $obj.service_mesh},
                  {"field": "Автомасштабирование", "value": $obj.cluster_autoscaler ? "Да" : "Нет"},
                  {"field": "Свой кластер", "value": $obj.is_own ? "Да" : "Нет"},
                  {"field": "Внешний ID", "value": $obj.external_id}
                ] ~> $append($az_rows) ~> $append($loc_rows)
              : []
          )

      k8s_location_tree:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: plantuml
        template: templates/server_location.puml
        origin:
          k8s: seaf.company.ds.ta.k8s
          networks: seaf.company.ds.ta.networks
          segments: seaf.company.ds.ta.network_segments
          dcs: seaf.company.ds.ta.dcs
          offices: seaf.company.ds.ta.dc_offices
        source: >
          (
            $objs := k8s;
            $networks := networks;
            $segments := segments;
            $dcs := dcs;
            $offices := offices;
            $obj := $lookup($objs, $params.id);
            $has_obj := $exists($obj.__id__);
            $resolve_location := function($id){
              $lookup($dcs, $id) ? $lookup($dcs, $id) : $lookup($offices, $id)
            };
            $obj_node :=
              $has_obj
                ? "node \"Kubernetes: [[/entities/" & $obj.__entity_id__ & "/card?id=" & $obj.__id__ & " " & $obj.title & "]]\" as obj_" & $replace($obj.__id__,"[^A-Za-z0-9_]","_") & "\n"
                : "";
            $net_ids := (
              ($exists($obj.network_connection) ? ($type($obj.network_connection) = "array" ? $obj.network_connection : [$obj.network_connection]) : []) ~>
              $append($exists($obj.management_networks) ? ($type($obj.management_networks) = "array" ? $obj.management_networks : [$obj.management_networks]) : [])
            );
            $net_nodes :=
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $exists($net.__id__)
                      ? "node \"Сеть: [[/entities/" & $net.__entity_id__ & "/card?id=" & $net.__id__ & " " & $net.title & "]]\" as net_" & $replace($net.__id__,"[^A-Za-z0-9_]","_") & "\n"
                      : ""
                  ) ~> $join("")
                : "";
            $seg_nodes :=
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
                    $seg_ids.(
                      $seg := $lookup($segments, $);
                      $exists($seg.__id__)
                        ? "node \"Сегмент: [[/entities/" & $seg.__entity_id__ & "/card?id=" & $seg.__id__ & " " & $seg.title & "]]\" as seg_" & $replace($seg.__id__,"[^A-Za-z0-9_]","_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $loc_nodes :=
              $has_obj and $exists($obj.location)
                ? $obj.location[].(
                    $loc := $resolve_location($);
                    $exists($loc.__id__)
                      ? "node \"Локация: [[/entities/" & $loc.__entity_id__ & "/card?id=" & $loc.__id__ & " " & $loc.title & "]]\" as loc_" & $replace($loc.__id__,"[^A-Za-z0-9_]","_") & "\n"
                      : ""
                  ) ~> $join("")
                : "";
            $edges :=
              (
                $has_obj and $exists($obj.location)
                  ? $obj.location[].(
                      $loc := $resolve_location($);
                      $exists($loc.__id__)
                        ? "loc_" & $replace($loc.__id__,"[^A-Za-z0-9_]","_") & " --> obj_" & $replace($obj.__id__,"[^A-Za-z0-9_]","_") & "\n"
                        : ""
                    ) ~> $join("")
                  : ""
              ) &
              (
                $has_obj and $exists($net_ids[0])
                  ? $net_ids.(
                      $net := $lookup($networks, $);
                      $exists($net.__id__)
                        ? "net_" & $replace($net.__id__,"[^A-Za-z0-9_]","_") & " --> obj_" & $replace($obj.__id__,"[^A-Za-z0-9_]","_") & "\n"
                        : ""
                    ) ~> $join("")
                  : ""
              );
            $edges_loc_net :=
              $has_obj and $exists($obj.location) and $exists($net_ids[0])
                ? $obj.location[].(
                    $loc := $resolve_location($);
                    $loc_id := $replace($loc.__id__,"[^A-Za-z0-9_]","_");
                    $net_ids.(
                      $net := $lookup($networks, $);
                      $exists($net.__id__)
                        ? "loc_" & $loc_id & " --> net_" & $replace($net.__id__,"[^A-Za-z0-9_]","_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $edges_net_seg :=
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $net_id := $replace($net.__id__,"[^A-Za-z0-9_]","_");
                    $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
                    $seg_ids.(
                      $seg := $lookup($segments, $);
                      $exists($seg.__id__)
                        ? "net_" & $net_id & " --> seg_" & $replace($seg.__id__,"[^A-Za-z0-9_]","_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $diagram :=
              $has_obj
                ? (
                    "@startuml\n" &
                    "left to right direction\n" &
                    "skinparam nodesep 60\n" &
                    "skinparam ranksep 60\n" &
                    "skinparam backgroundColor #ffffff\n" &
                    "skinparam defaultTextAlignment center\n" &
                    "skinparam shadowing false\n" &
                    "skinparam rectangle {\n" &
                    "  BackgroundColor #f2f4f7\n" &
                    "  BorderColor #4d6bf0\n" &
                    "  FontColor #111318\n" &
                    "}\n" &
                    "skinparam node {\n" &
                    "  BackgroundColor #fdfdfd\n" &
                    "  BorderColor #4d6bf0\n" &
                    "  FontColor #111318\n" &
                    "}\n" &
                    "skinparam arrowColor #4d6bf0\n" &
                    "skinparam arrowFontColor #111318\n" &
                    $loc_nodes & $seg_nodes & $net_nodes & $obj_node & $edges_loc_net & $edges_net_seg & $edges &
                    "@enduml"
                  )
                : "@startuml\nnote \"K8s не найден\" as no_obj\n@enduml";
            { "diagram": $diagram }
          )

      k8s_networks:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: title
            text: Сеть
            link: link
          - value: role
            text: Роль
          - value: segment
            text: Сегмент
            link: segment_link
        origin:
          k8s: seaf.company.ds.ta.k8s
          networks: seaf.company.ds.ta.networks
          segments: seaf.company.ds.ta.network_segments
        source: >
          (
            $obj := $lookup(k8s, $params.id);
            $networks := networks;
            $segments := segments;
            $combined :=
              ($exists($obj.network_connection) ? ($type($obj.network_connection) = "array" ? $obj.network_connection : [$obj.network_connection]) : []) ~>
              $append($exists($obj.management_networks) ? ($type($obj.management_networks) = "array" ? $obj.management_networks : [$obj.management_networks]) : []);
            $combined.(
              $net := $lookup($networks, $);
              $role := $id in ($exists($obj.management_networks) ? ($type($obj.management_networks) = "array" ? $obj.management_networks : [$obj.management_networks]) : []) ? "Управляющая" : "Прикладная";
              $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
              $seg_titles := $seg_ids.($lookup($segments, $).title) ~> $join(", ");
              $seg_link := $exists($seg_ids[0]) ? "/entities/seaf.ta.services.network_segments/card?id=" & $seg_ids[0] : null;
              {
                "title": $net.title,
                "link": $exists($net) ? "/entities/" & $net.__entity_id__ & "/card?id=" & $net.__id__ : null,
                "role": $role,
                "segment": $seg_titles,
                "segment_link": $seg_link
              }
            )
          )

