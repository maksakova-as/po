entities:
  seaf.company.cybersec.systems:
    menu: >
      (
      $entity_id := "seaf.company.cybersec.systems";
      $domain_id := "seaf.company.cybersec";
      $root_menu := $seaf_fn_get_root_menu($."seaf.configs", $domain_id);
      $root_menu_order := $seaf_fn_get_root_menu_order($."seaf.configs", $domain_id);
      $menu_order := 200;
      $menu := $seaf_fn_generate_menu_item("Системы кибербезопасности", $root_menu);
      [
      $exists($.$lookup($entity_id)) 
      ?   {
          "link": "/entities/" & $entity_id & "/list",
          "location": $menu,
          "order": $root_menu_order + $menu_order
          }
      ]
      )
