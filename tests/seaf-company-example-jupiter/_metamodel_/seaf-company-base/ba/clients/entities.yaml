entities:
  seaf.company.ba.clients:
    title: &entity_title Клиенты
    description: &entity_description |
      Потребители продуктов Компании (внутренние и внешние).
      \n Используйте ключ (идентификатор) объекта вида: 
      \n <компания>.client.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.def.lifecycle_stage"

          properties:
            is_part_of:
              title: Является частью
              description: Используется для задания древовидной структуры объектов
              $ref: "#/$rels/seaf.company.ba.clients.client"

            type:
              title: Тип клиента
              description: Типы - верхнеуровневые сегменты клиентов
              enum:
                - Физические лица
                - Микро/Малый бизнес
                - Крупный и средний бизнес
                - Крупнейшие клиенты и финансовые институты
                - Сотрудники компании

            count_metrics:
              title: Количественные метрики
              description: |
                Метрики по замеру количества клиентов. Допускается указание приблизительного числа клиентов для 
                качественной оценки объемов обслуживания
              type: array
              items:
                type: object
                properties:
                  metric:
                    title: Метрика
                    description: Название метрики, например MAU
                    type: string
                  value:
                    title: Значение метрики
                    description: Числовое значение в указанных единицах измерения
                    type: [string, number]
                  units:
                    title: Единицы измерения
                    description: Название единиц измерения метрики
                    type: string

            uses_it_services:
              title: Использует ИТ-сервисы
              description: Перечень ссылок на ИТ-сервисы, используемые клиентом
              type: array
              items:
                $ref: "#/$rels/seaf.company.services.service"

          required:
            - type

    objects:
      client:
        route: "/"
        title: Клиент
        symbol: "client"