entities:
  seaf.company.ba.processes:
    title: &entity_title Процессы
    description: &entity_description |
      Процесс - это регулярно повторяющаяся последовательность действий, ограниченная во времени, 
      направленная на достижение конкретных результатов (продуктов, услуг, решений, событий, иных артефактов).
      \n Используйте ключ (идентификатор) объекта вида: 
      \n <компания>.process.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    schema:
      title: *entity_title
      description: *entity_description
      type: object

      additionalProperties: false
      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.def.lifecycle_stage"

          properties:
            is_part_of:
              title: Является частью
              description: Используется для задания древовидной структуры объектов
              $ref: "#/$rels/seaf.company.ba.processes.process"

            produces:
              title: Производит
              description: Ссылки на продукты, производимые в рамках процесса
              type: array
              minItems: 1
              items:
                $ref: "#/$rels/seaf.company.ba.products.product"

            uses_it_services:
              title: Использует ИТ-сервисы
              description: Ссылки на ИТ-сервисы, потребляемые в рамках процесса
              type: array
              minItems: 1
              items:
                $ref: "#/$rels/seaf.company.services.service"

            uses_data:
              title: Использует данные
              description: Указание бизнес-объектов, используемых в рамках процесса
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  business_term:
                    title: Бизнес-термин
                    description: Ссылка на бизнес-объект из реестра бизнес-терминов
                    type: string
                    $ref: "#/$rels/seaf.company.da.business_terms.business_term"
                  usage_mode:
                    title: Режим использования
                    type: string
                    enum:
                      - read-only
                      - read-write

    objects:
      process:
        route: "/"
        title: Процесс
        symbol: "process"