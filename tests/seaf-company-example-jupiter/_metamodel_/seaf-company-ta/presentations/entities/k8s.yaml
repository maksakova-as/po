entities:
  seaf.company.ta.services.k8s:
    presentations:
      list:
        title: Кластеры Kubernetes
        type: table
        headers:
          - value: title
            text: Название
            link: link
          - value: availability_zones
            text: Зоны
          - value: locations
            text: Локации
            link: location_link
          - value: cni
            text: CNI
          - value: service_mesh
            text: Service mesh
          - value: softwares
            text: ПО
          - value: is_own
            text: Свой
          - value: networks
            text: Сети
        origin:
          k8s: seaf.company.ds.ta.k8s
          networks: seaf.company.ds.ta.networks
          dcs: seaf.company.ds.ta.dcs
          offices: seaf.company.ds.ta.dc_offices
          azs: seaf.company.ds.ta.dc_azs
          softwares: seaf.company.ds.ta.software
        source: >
          (
            $k8s := k8s;
            $networks := networks;
            $dcs := dcs;
            $offices := offices;
            $azs := azs;
            $softwares := softwares;
            $resolve_location := function($id){
              $lookup($dcs, $id) ? $lookup($dcs, $id) : $lookup($offices, $id)
            };
            $resolve_network := function($id){ $lookup($networks, $id) };
            $to_list := function($v){ $type($v) = "array" ? $v : ($exists($v) ? [$v] : []) };
            $k8s.*@$cluster.(
              $location_objects := $exists($cluster.location)
                ? $cluster.location[].($resolve_location($))
                : [];
              $network_titles := $exists($cluster.network_connection)
                ? $cluster.network_connection[].($resolve_network($).title)
                : [];
              $software_ids := $exists($cluster.softwares) ? $to_list($cluster.softwares) : $to_list($cluster.software);
              $software_titles := $software_ids.(
                $sw_title := $lookup($softwares, $).title;
                $sw_title ? $sw_title : $
              ) ~> $join(", ");
              $az_titles := $exists($cluster.availabilityzone)
                ? $cluster.availabilityzone[].($lookup($azs, $).title)
                : [];
              {
                "id": $cluster.__id__,
                "link": "/entities/" & $cluster.__entity_id__ & "/card?id=" & $cluster.__id__,
                "title": $cluster.title,
                "availability_zones": $az_titles ~> $join(", "),
                "locations": $location_objects.title ~> $join(", "),
                "location_link": $exists($location_objects[0])
                  ? "/entities/" & $location_objects[0].__entity_id__ & "/card?id=" & $location_objects[0].__id__
                  : null,
                "cni": $cluster.cni,
                "service_mesh": $cluster.service_mesh,
                "softwares": $software_titles,
                "is_own": $cluster.is_own ? "Да" : "Нет",
                "networks": $network_titles ~> $join(", ")
              }
            )[];
          )

      card:
        title: Карточка кластера Kubernetes
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        type: mkr-grid
        widgets:
          header:
            align: "^"
            presentation: header
            order: 0
            style:
              margin: 0px
              padding: 0px
              border: false
          details:
            title: Атрибуты
            presentation: k8s_details
            align: "v"
            order: 10
          location_tree:
            title: Локация / сети
            presentation: k8s_location_tree
            align: "v"
            order: 20
          networks:
            title: Подключённые сети
            presentation: k8s_networks
            align: "v"
            order: 30
          infra:
            title: Инфраструктура
            presentation: k8s_infra
            align: "v"
            order: 40
          nodes:
            title: Ноды
            presentation: k8s_nodes
            align: "v"
            order: 50
          apps:
            title: Приложения/компоненты
            presentation: k8s_apps
            align: "v"
            order: 60
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            $obj := $lookup(objects, $params.id);
            $exists($obj.__id__)
              ? $seaf_fn_combine_widgets($self, $obj.__entity_id__, $obj.__id__)
              : { "type": "rows", "items": [] };
          )

      k8s_details:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: field
            text: Атрибут
          - value: value
            text: Значение
            link: link
        origin:
          k8s: seaf.company.ds.ta.k8s
          azs: seaf.company.ds.ta.dc_azs
          dcs: seaf.company.ds.ta.dcs
          offices: seaf.company.ds.ta.dc_offices
          softwares: seaf.company.ds.ta.software
        source: >
          (
            $obj := $lookup(k8s, $params.id);
            $azs := azs;
            $dcs := dcs;
            $offices := offices;
            $softwares := softwares;
            $resolve_location := function($id){
              $lookup($dcs, $id) ? $lookup($dcs, $id) : $lookup($offices, $id)
            };
            $to_list := function($v){ $type($v) = "array" ? $v : ($exists($v) ? [$v] : []) };
            $software_ids := $exists($obj.softwares) ? $to_list($obj.softwares) : $to_list($obj.software);
            $software_titles := $software_ids.(
              $sw_title := $lookup($softwares, $).title;
              $sw_title ? $sw_title : $
            ) ~> $join(", ");
            $az_rows := $exists($obj.availabilityzone)
              ? $obj.availabilityzone[].(
                  $az := $lookup($azs, $);
                  {
                    "field": "Зона доступности",
                    "value": $az.title,
                    "link": $exists($az) ? "/entities/" & $az.__entity_id__ & "/card?id=" & $az.__id__ : null
                  }
                )
              : [];
            $loc_rows := $exists($obj.location)
              ? $obj.location[].(
                  $loc := $resolve_location($);
                  {
                    "field": "Локация",
                    "value": $loc.title,
                    "link": $exists($loc) ? "/entities/" & $loc.__entity_id__ & "/card?id=" & $loc.__id__ : null
                  }
                )
              : [];
            $exists($obj)
              ? [
                  {"field": "ID", "value": $obj.__id__},
                  {"field": "Название", "value": $obj.title},
                  {"field": "Описание", "value": $obj.description},
                  {"field": "FQDN", "value": $obj.fqdn},
                  {"field": "ПО", "value": $software_titles},
                  {"field": "CNI", "value": $obj.cni},
                  {"field": "Service mesh", "value": $obj.service_mesh},
                  {"field": "Автомасштабирование", "value": $obj.cluster_autoscaler ? "Да" : "Нет"},
                  {"field": "Свой кластер", "value": $obj.is_own ? "Да" : "Нет"},
                  {"field": "Внешний ID", "value": $obj.external_id}
                ] ~> $append($az_rows) ~> $append($loc_rows)
              : []
          )

      k8s_location_tree:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: plantuml
        template: ../widgets/templates/server_location.puml
        origin:
          k8s: seaf.company.ds.ta.k8s
          networks: seaf.company.ds.ta.networks
          segments: seaf.company.ds.ta.network_segments
          dcs: seaf.company.ds.ta.dcs
          offices: seaf.company.ds.ta.dc_offices
        source: >
          (
            $objs := k8s;
            $networks := networks;
            $segments := segments;
            $dcs := dcs;
            $offices := offices;
            $obj := $lookup($objs, $params.id);
            $has_obj := $exists($obj.__id__);
            $resolve_location := function($id){
              $lookup($dcs, $id) ? $lookup($dcs, $id) : $lookup($offices, $id)
            };
            $obj_node :=
              $has_obj
                ? "node \"Kubernetes: [[/entities/" & $obj.__entity_id__ & "/card?id=" & $obj.__id__ & " " & $obj.title & "]]\" as obj_" & $replace($obj.__id__,/[^A-Za-z0-9_]/,"_") & " #d1c4e9\n"
                : "";
            $net_ids := (
              ($exists($obj.network_connection) ? ($type($obj.network_connection) = "array" ? $obj.network_connection : [$obj.network_connection]) : []) ~>
              $append($exists($obj.management_networks) ? ($type($obj.management_networks) = "array" ? $obj.management_networks : [$obj.management_networks]) : [])
            );
            $net_nodes :=
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $exists($net.__id__)
                      ? "node \"Сеть: [[/entities/" & $net.__entity_id__ & "/card?id=" & $net.__id__ & " " & $net.title & "]]\" as net_" & $replace($net.__id__,/[^A-Za-z0-9_]/,"_") & " #c8e6c9\n"
                      : ""
                  ) ~> $join("")
                : "";
            $seg_nodes :=
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
                    $seg_ids.(
                      $seg := $lookup($segments, $);
                      $exists($seg.__id__)
                        ? "node \"Сегмент: [[/entities/" & $seg.__entity_id__ & "/card?id=" & $seg.__id__ & " " & $seg.title & "]]\" as seg_" & $replace($seg.__id__,/[^A-Za-z0-9_]/,"_") & " #ffecb3\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $loc_nodes :=
              $has_obj and $exists($obj.location)
                ? $obj.location[].(
                    $loc := $resolve_location($);
                    $exists($loc.__id__)
                      ? "node \"Локация: [[/entities/" & $loc.__entity_id__ & "/card?id=" & $loc.__id__ & " " & $loc.title & "]]\" as loc_" & $replace($loc.__id__,/[^A-Za-z0-9_]/,"_") & " #bbdefb\n"
                      : ""
                  ) ~> $join("")
                : "";
            $edges :=
              (
                $has_obj and $exists($obj.location)
                  ? $obj.location[].(
                      $loc := $resolve_location($);
                      $exists($loc.__id__)
                        ? "loc_" & $replace($loc.__id__,/[^A-Za-z0-9_]/,"_") & " --> obj_" & $replace($obj.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  : ""
              ) &
              (
                $has_obj and $exists($net_ids[0])
                  ? $net_ids.(
                      $net := $lookup($networks, $);
                      $exists($net.__id__)
                        ? "net_" & $replace($net.__id__,/[^A-Za-z0-9_]/,"_") & " --> obj_" & $replace($obj.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  : ""
              );
            $edges_loc_net :=
              $has_obj and $exists($obj.location) and $exists($net_ids[0])
                ? $obj.location[].(
                    $loc := $resolve_location($);
                    $loc_id := $replace($loc.__id__,/[^A-Za-z0-9_]/,"_");
                    $net_ids.(
                      $net := $lookup($networks, $);
                      $exists($net.__id__)
                        ? "loc_" & $loc_id & " --> net_" & $replace($net.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $edges_net_seg :=
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $net_id := $replace($net.__id__,/[^A-Za-z0-9_]/,"_");
                    $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
                    $seg_ids.(
                      $seg := $lookup($segments, $);
                      $exists($seg.__id__)
                        ? "net_" & $net_id & " --> seg_" & $replace($seg.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $diagram :=
              $has_obj
                ? (
                    "@startuml\n" &
                    "left to right direction\n" &
                    "skinparam nodesep 60\n" &
                    "skinparam ranksep 60\n" &
                    "skinparam backgroundColor #ffffff\n" &
                    "skinparam defaultTextAlignment center\n" &
                    "skinparam shadowing false\n" &
                    "skinparam rectangle {\n" &
                    "  BackgroundColor #f2f4f7\n" &
                    "  BorderColor #4d6bf0\n" &
                    "  FontColor #111318\n" &
                    "}\n" &
                    "skinparam node {\n" &
                    "  BackgroundColor #fdfdfd\n" &
                    "  BorderColor #4d6bf0\n" &
                    "  FontColor #111318\n" &
                    "}\n" &
                    "skinparam arrowColor #4d6bf0\n" &
                    "skinparam arrowFontColor #111318\n" &
                    $loc_nodes & $seg_nodes & $net_nodes & $obj_node & $edges_loc_net & $edges_net_seg & $edges &
                    "@enduml"
                  )
                : "@startuml\nnote \"K8s не найден\" as no_obj\n@enduml";
            { "diagram": $diagram }
          )

      k8s_networks:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: title
            text: Сеть
            link: link
          - value: role
            text: Роль
          - value: segment
            text: Сегмент
            link: segment_link
        origin:
          k8s: seaf.company.ds.ta.k8s
          networks: seaf.company.ds.ta.networks
          segments: seaf.company.ds.ta.network_segments
        source: >
          (
            $obj := $lookup(k8s, $params.id);
            $networks := networks;
            $segments := segments;
            $combined :=
              ($exists($obj.network_connection) ? ($type($obj.network_connection) = "array" ? $obj.network_connection : [$obj.network_connection]) : []) ~>
              $append($exists($obj.management_networks) ? ($type($obj.management_networks) = "array" ? $obj.management_networks : [$obj.management_networks]) : []);
            $combined.(
              $net := $lookup($networks, $);
              $role := $id in ($exists($obj.management_networks) ? ($type($obj.management_networks) = "array" ? $obj.management_networks : [$obj.management_networks]) : []) ? "Управляющая" : "Прикладная";
              $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
              $seg_titles := $seg_ids.($lookup($segments, $).title) ~> $join(", ");
              $seg_link := $exists($seg_ids[0]) ? "/entities/seaf.ta.services.network_segments/card?id=" & $seg_ids[0] : null;
              {
                "title": $net.title,
                "link": $exists($net) ? "/entities/" & $net.__entity_id__ & "/card?id=" & $net.__id__ : null,
                "role": $role,
                "segment": $seg_titles,
                "segment_link": $seg_link
              }
            )
          )

      k8s_infra:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: title
            text: Объект
            link: link
          - value: type
            text: Тип
        origin:
          data: seaf.company.ds.ta.k8s_infra_objects
        source: >
          (
            $id := $params.id;
            $rows := $type(data) = "array" ? data : data.*;
            $rows[$.cluster = $id]
          )

      k8s_nodes:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: title
            text: Нода/деплой/HPA
            link: link
          - value: type
            text: Тип
        origin:
          data: seaf.company.ds.ta.k8s_cluster_objects
        source: >
          (
            $id := $params.id;
            $data := data;
            $type($data) = "array"
              ? $data[$.cluster = $id]
              : $data.*[$.cluster = $id]
          )

      k8s_apps:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: title
            text: Объект
            link: link
          - value: id
            text: ID
        origin:
          k8s: seaf.company.ds.ta.k8s
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            $obj := $lookup(k8s, $params.id);
            $objects := objects;
            $app_ids := $exists($obj.app_components) ? $obj.app_components : [];
            $app_ids := $type($app_ids) = "array" ? $app_ids : ($exists($app_ids) ? [$app_ids] : []);
            $app_ids.(
              $o := $lookup($objects, $);
              {
                "title": $exists($o.title) ? $o.title : $,
                "link": $exists($o.__entity_id__) ? "/entities/" & $o.__entity_id__ & "/card?id=" & $o.__id__ : null,
                "id": $
              }
            )
          )

      header:
        type: markdown
        template: ../../../seaf-company-base/_shared/templates/header.md
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            /*  ищем объект для презентации */
            $obj2present := $lookup(objects, $params.id);
            {
              "entity": $obj2present.__entity_title__,
              "title": $obj2present.title
            }
          )
