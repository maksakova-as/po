rules:
  validators:
    seaf.validation.ta.p3.monitoring_presence:
      uid: SEAF-TA-P3-MON-PRESENCE
      title: "[TACSA_4-P3-36-04 (частично)] Наличие сервиса мониторинга"
      description: |
        Частичная проверка наличия централизованного мониторинга: проверяется существование
        хотя бы одного объекта `seaf.company.ta.services.monitorings`.
        Требование (частично): TACSA_4-P3-36-04 — Централизованный сбор и хранение телеметрии/логов для анализа и расследований.
        
        Требование (цитата):
        Инфраструктурные сервисы платформы контейнерной оркестрации (системные компоненты кластера) должны быть размещены на отдельных выделенных узлах кластера, которые не используются для размещения пользовательских приложений.
      correction: |
        Добавьте описание сервиса мониторинга в модель (`seaf.company.ta.services.monitorings`).
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.p3.monitoring_presence";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $req := "Инфраструктурные сервисы платформы контейнерной оркестрации (системные компоненты кластера) должны быть размещены на отдельных выделенных узлах кластера, которые не используются для размещения пользовательских приложений.";
                  $code := "TACSA_4-P3-36-04";
                  $data := $."seaf.company.ta.services.monitorings";
                  ($not($exists($data)) or $count($keys($data)) = 0) ? {
                    "uid": "seaf.validation.ta.p3.monitoring_presence.absent",
                    "deviation_id": $code & ":" & "seaf.validation.ta.p3.monitoring_presence.absent",
                    "title": "Отсутствует сервис мониторинга",
                    "correction": "ID: " & "seaf.validation.ta.p3.monitoring_presence.absent" & ". " & ("Опишите сервис мониторинга в разделе services"),
                    "description": "В модели не найден seaf.company.ta.services.monitorings\n\nТребование (цитата):\n" & $req
                  }
                )
              ])
            )
            : []
        )
