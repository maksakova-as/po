entities:
  seaf.company.da.business_terms:
    title: &entity_title Бизнес-термины
    description: &entity_description >
      Бизнес-термин - понятие, которым оперируют бизнес-процессы компании.
      Обеспечивает связь с Бизнес Архитектурой (БА), посредством включения бизнес-терминов в бизнес-процессах.
      \n Используйте ключ (идентификатор) объекта вида: 
      \n - <компания>.bt.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    objects:
      business_term:
        route: "/"
        title: Бизнес-термин
        symbol: "bsn_term"

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.def.lifecycle_stage"

          properties:

            creation_date:
              title: Дата создания термина
              description: Дата создания термина
              $ref: "#/$defs/seaf.def.type.date"

            modify_date:
              title: Дата изменения термина
              description: Дата изменения термина
              $ref: "#/$defs/seaf.def.type.date"

            owner:
              title: Владелец (ФИО)
              description: ФИО владелеца данных
              type: string
              minLength: 5

            legal_docs:
              title: Нормативные документы
              type: array
              description: Ссылки на документы, рабочие пространства, которые определяют термин
              items:
                type: string
