  template-export-1:
    type: excel-export
    location: Пример использования/Экспорт-1

    file_name: >
      ("test.xls")

    options:
      show-grid-lines: false
      margin-left: 3.5
      margin-top: 10.5
      table:
        headers:
          height: 28.5

    pages:
      - name: Страница
        components:
          - type: table
            name: tableForImport

            source: >
              (   
                  $headers := [
                      {"value": "ID"},
                      {"value": "name"},
                      {"value": "age"}
                  ];
              
                  {   
                      "headers": $headers,
                      "body": [
                        ["", "", ""],
                        ["", "", ""],
                        ["", "", ""],
                        ["", "", ""]
                      ]
                  }
              )

