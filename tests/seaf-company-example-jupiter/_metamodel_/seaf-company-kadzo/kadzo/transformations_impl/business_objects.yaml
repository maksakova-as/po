datasets:
  seaf.company.ds.kadzo:
    # дополняем origin сводного датасета
    origin:
      kadzo.v2023.business_objects: seaf.company.ds.kadzo.business_objects

  seaf.company.ds.kadzo.business_objects:
    title: Бизнес-объекты КАДЗО
    description: Датасет-трансформатор данных из формата SEAF в формат КАДЗО
    origin:
      obj_in: seaf.company.ds.da.business_terms
      objects_links: seaf.ds.objects_links
      objects: seaf.ds.objects
      kadzo_status_enum:
        "Идея в проработке": Планируется
        "Создается": Разрабатывается или модифицируется
        "Тестируется": Разрабатывается или модифицируется
        "Используется и развивается": Используется
        "Используется": Используется
        "В архиве": В архиве
        "Выведен из эксплуатации": Выводится из эксплуатации

    # Принятые допущения:
    #    -

    source: >
      (
      $obj_in := obj_in;
      $objects_links := objects_links;
      $objects := objects;
      $kadzo_status_enum := kadzo_status_enum;
      
      $obj_out := $each($obj_in, function ($val, $key) {(
          /* готовим данные */
          /* выявляем привязанные процессы */
          $linked_procs := [$lookup($objects_links, $key)[link_attr="uses_data.business_term" and link_dir="reverse"].linked_id];
          /* формируем объект КАДЗО */
          { $key: {
              "title": $val.title,
              "comments": $val.comments,
              "processes": $linked_procs != [] ? $linked_procs, 
              "status": (
                $attr_val := $val.lifecycle_stage;
                $exists($attr_val) and $attr_val != null ? $seaf_company_fn_kadzo_convert_enum($kadzo_status_enum, $attr_val, [$key, "атрибут lifecycle_stage", $attr_val])
              )
          }}
      )})[] ~> $merge();
      $obj_out
      )
