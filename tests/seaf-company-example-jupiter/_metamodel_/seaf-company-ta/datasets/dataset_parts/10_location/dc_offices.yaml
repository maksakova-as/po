# Назначение: Сбор и нормализация офисных локаций TA.
# Используется: app, widgets, auto_tests, internal_docs, docs, presentations и другие разделы метамодели.
datasets:
  seaf.company.ds.ta.dc_offices:
    description: |
      Коллекция офисов и точек присутствия компании
    origin:
      objects: seaf.ds.objects_by_entities
      data_lake: ($)
      cfg: seaf.company.ds.ta._config
    source: >
      (
        $sources_enabled := cfg.enabled;
        $sources_priority := cfg.priority;

        $seaf2_data := objects."seaf.company.ta.services.dc_offices";

        $seaf1_data := "seaf1" in $sources_enabled
          ? (
              $seaf1_raw := data_lake."seaf.ta.services.office";
              $seaf1_raw ? $seaf1_raw.$spread().(
                $id := $keys()[0];
                $obj := $.*[0];
                $new_id := "seaf1." & $id;
                {
                  $new_id: {
                    "__id__": $new_id,
                    "__entity_id__": "seaf.company.ta.services.dc_offices",
                    "__link_to_card__": "/entities/seaf.company.ta.services.dc_offices/card?id=" & $new_id,
                    "title": $obj.title,
                    "description": $obj.description,
                    "address": $obj.address,
                    "external_id": $obj.external_id,
                    "region": $obj.region ? "seaf1." & $obj.region : null,
                    "legacy_id": $id,
                    "source": "seaf1"
                  }
                }
              ) ~> $merge()
            )
          : {};

        $merge_list := $sources_priority.(
          $src := $;
          $src = "seaf2" and "seaf2" in $sources_enabled ? $seaf2_data : (
            $src = "seaf1" and "seaf1" in $sources_enabled ? $seaf1_data : (
              {}
            )
          )
        );

        $merge($merge_list)
      )
