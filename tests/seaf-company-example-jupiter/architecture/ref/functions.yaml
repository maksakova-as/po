    is_part_of: jupiter.function.it

  jupiter.function.messaging_transport:
    title: Транспорт сообщений
    description: >
      Функциональность, обеспечивающая доставку сообщений от одной системы к другой
    is_part_of: jupiter.function.integration_management

  jupiter.function.messaging_gateway:
    title: Шлюз сообщений
    description: >
      Функциональность, обеспечивающая проверку и фильтрацию сообщений
    is_part_of: jupiter.function.integration_management
