            $app_ids := $exists($obj.app_components) ? $obj.app_components : [];
            $app_ids := $type($app_ids) = "array" ? $app_ids : ($exists($app_ids) ? [$app_ids] : []);
            $app_ids.(
              $o := $lookup($objects, $);
              {
                "title": $exists($o.title) ? $o.title : $,
                "link": $exists($o.__entity_id__) ? "/entities/" & $o.__entity_id__ & "/card?id=" & $o.__id__ : null,
                "id": $
              }
            )
