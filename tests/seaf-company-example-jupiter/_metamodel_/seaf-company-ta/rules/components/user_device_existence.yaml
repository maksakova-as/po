rules:
  validators:
    seaf.validation.ta.components.user_device_existence:
      uid: SEAF-TA-EXIST-USER-DEVICE
      title: Проверка наличия Клиентского устройства (user_device)
      description: |
        Проверяет, что в архитектуре описано хотя бы одно Клиентское устройство (seaf.company.ta.components.user_devices).
      correction: |
        Убедитесь, что в файлах архитектуры (`/architecture/ta/`) описан
        хотя бы один объект типа `seaf.company.ta.components.user_devices`.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.components.user_device_existence";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $data := $."seaf.company.ta.components.user_devices";
                  $count($data) = 0 ? {
                      "uid": "seaf.validation.ta.existence.user_device",
                      "title": "Отсутствует описание Клиентского устройства (user_device)",
                      "correction": "ID: " & "seaf.validation.ta.existence.user_device" & ". " & ("Необходимо описать хотя бы одно Клиентское устройство (seaf.company.ta.components.user_devices) в архитектуре."),
                      "description": "В архитектуре не найдено ни одного Клиентского устройства."
                  }
                )
              ])
            )
            : []
        )
