entities:
  seaf.company.cybersec.systems:
    title: &entity_title Системы кибербезопасности
    description: &entity_description |
      Автоматизированная система (АС) - самостоятельный объект управления в ИТ-процессах,
      представляющий собой набор разработанных или заимствованных компонентов программного обеспечения,
      реализующих логически связанный набор функциональности для выполнения необходимых бизнес-задач, 
      а также для поддержки других АС.
      АС кибербезопасности реализуюет функциональность для задач информационной защиты.
      \n Используйте ключ (идентификатор) объекта вида: 
      \n - <компания>.cs_system.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    objects:
      system:
        route: "/"
        title: Система
        symbol: system

    schema:
      $defs:
        seaf.company.def.cybersec.system_classes_enum:
          enum:
            - ИБ-Антивирусное ПО
            - ИБ-Аудит действий персонала
            - ИБ-Аутентификация пользователей
            - ИБ-Биометрия
            - ИБ-Защита от киберугроз
            - ИБ-Защита от сетевых атак
            - ИБ-Защита от утечек информации
            - ИБ-Защита трафика
            - ИБ-Криптография и шифрование
            - ИБ-Предотвращение мошенничества
            - ИБ-Управление доступом
            - ИБ-Управление сертификатами
            - ИБ-Управление событиями инф.безопасности
            - Иное

        seaf.company.def.cybersec.system_attributes:
          properties:

            is_part_of:
              title: Является частью
              description: Родительская система для данной функциональной подсистемы
              $ref: "#/$rels/seaf.company.cybersec.systems.system"

            class:
              title: Класс
              description: |
                Класс, определяющий основное предназначение системы \ функциональной подсистемы
              $ref: "#/$defs/seaf.company.def.cybersec.system_classes_enum"

          required:
            - class

      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          allOf:
            #  конструируем сущность из компонентов схемы
            - $ref: "#/$defs/seaf.company.def.system"
# не исп. для систем КБ           - $ref: "#/$defs/seaf.company.def.system_criticality_level"
# не исп. для систем КБ           - $ref: "#/$defs/seaf.company.def.system_sla_parameters"
            - $ref: "#/$defs/seaf.company.def.tech_params.scalability"
            - $ref: "#/$defs/seaf.company.def.tech_params.monitoring"
            - $ref: "#/$defs/seaf.company.def.tech_params.ha"
            - $ref: "#/$defs/seaf.company.def.tech_params.dr"
            - $ref: "#/$defs/seaf.company.def.tech_params.backup"
            - $ref: "#/$defs/seaf.company.def.cybersec.system_attributes"
            - $ref: "#/$defs/seaf.def.stakeholders"
