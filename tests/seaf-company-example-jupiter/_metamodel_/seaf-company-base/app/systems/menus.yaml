entities:
  seaf.company.app.systems:
    menu: >
      (
      $entity_id := "seaf.company.app.systems";
      $domain_id := "seaf.company.app";
      $root_menu := $seaf_fn_get_root_menu($."seaf.configs", $domain_id);
      $root_menu_order := $seaf_fn_get_root_menu_order($."seaf.configs", $domain_id);
      $menu := [];
      /* Список систем */
      $m := (
          $menu_item_name := $seaf_fn_generate_menu_item("Автоматизированные системы", $root_menu);
          $menu_item_order := 100;
          $exists($.$lookup($entity_id)) 
          ?   [{
              "link": "/entities/" & $entity_id & "/list",
              "location": $menu_item_name,
              "order": $root_menu_order + $menu_item_order
              }]
      );
      $menu := $append($menu, $m);
      )
