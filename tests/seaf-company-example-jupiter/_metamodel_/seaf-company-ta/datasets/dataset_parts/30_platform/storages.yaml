# Назначение: Единый реестр сервисов хранения данных.
# Используется: widgets, auto_tests, presentations, ta, internal_docs, docs.
datasets:
  seaf.company.ds.ta.storages:
    description: |
      Коллекция сервисов хранения данных
    origin:
      objects: seaf.ds.objects_by_entities
      data_lake: ($)
      reverse_platform_cache: seaf.company.ds.ta._cache.reverse_platform
      kadzo_core_cache: seaf.company.ds.ta._cache.kadzo_core
      cfg: seaf.company.ds.ta._config
    source: >
      (
        $sources_enabled := cfg.enabled;
        $sources_priority := cfg.priority;

        $seaf2_data := objects."seaf.company.ta.services.storages";

        $seaf1_data := "seaf1" in $sources_enabled
          ? (
              $seaf1_raw := data_lake."seaf.ta.services.storage";
              $seaf1_raw ? $seaf1_raw.$spread().(
                $id := $keys()[0];
                $obj := $.*[0];
                $new_id := "seaf1." & $id;
                {
                  $new_id: $merge([
                    {
                      "__id__": $new_id,
                      "__entity_id__": "seaf.company.ta.services.storages",
                      "__link_to_card__": "/entities/seaf.company.ta.services.storages/card?id=" & $new_id,
                      "legacy_id": $id,
                      "source": "seaf1"
                    },
                    $obj,
                    {
                      "availabilityzone": $obj.availabilityzone ? $obj.availabilityzone.("seaf1." & $) : [],
                      "location": $obj.location ? $obj.location.("seaf1." & $) : [],
                      "network_connection": $obj.network_connection ? $obj.network_connection.("seaf1." & $) : []
                    }
                  ])
                }
              ) ~> $merge()
            )
          : {};

        $reverse_data := "reverse" in $sources_enabled
          ? (
              reverse_platform_cache.storages ? reverse_platform_cache.storages : {}
            )
          : {};

        $kadzo_data := "kadzo" in $sources_enabled
          ? (
              kadzo_core_cache.storages ? kadzo_core_cache.storages : {}
            )
          : {};

        $merge_list := $sources_priority.(
          $src := $;
          $src = "seaf2" and "seaf2" in $sources_enabled ? $seaf2_data : (
            $src = "seaf1" and "seaf1" in $sources_enabled ? $seaf1_data : (
              $src = "kadzo" and "kadzo" in $sources_enabled ? $kadzo_data : (
                $src = "reverse" and "reverse" in $sources_enabled ? $reverse_data : {}
              )
            )
          )
        );

        $merge($merge_list)
      )
