# Назначение: Подготовка датасета `seaf.company.ds.ta.k8s_hpas` (k8s hpas) в контуре seaf1_datasets.
# Используется: compat-слой seaf1 -> seaf2 (подключается по необходимости через extension root).
# SEAF1 counterpart of seaf.company.ds.ta.k8s_hpas
datasets:
  seaf.company.ds.ta.k8s_hpas:
    description: |
      Правила HPA
    origin:
      by_entities: seaf.ds.objects_by_entities
      data_lake: ($)
    source: >
      (
        $seaf2 := $exists(by_entities."seaf.company.ta.components.k8s_hpa") ? by_entities."seaf.company.ta.components.k8s_hpa" : {};
        $list := data_lake."seaf.ta.components.k8s_hpa";
        $seaf1 := $exists($list)
          ? $each($list, function($val, $key) {
              {
                $key: $merge([
                  $val,
                  {
                    "__id__": $key,
                    "__entity_id__": "seaf.company.ta.components.k8s_hpa",
                    "__entity_id": $key,
                    "__object_type": "seaf.company.ta.components.k8s_hpa"
                  }
                ])
              }
            }) ~> $merge()
          : {};
        $merge([$seaf2, $seaf1])
      )
