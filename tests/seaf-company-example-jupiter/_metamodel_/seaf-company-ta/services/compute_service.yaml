entities:
  seaf.company.ta.services.compute_services:
    title: &entity_title Вычислительный сервис
    description: &entity_description Прикладные и инфраструктурные вычислительные сервисы (БД, веб-фронты, шлюзы)

    objects:
      compute_service:
        route: "/"
        title: Вычислительный сервис
        symbol: compute_service

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            service_type:
              title: Тип сервиса
              type: string
              enum:
                - "Управление ИТ-службой, ИТ-инфраструктурой и ИТ-активами (CMDB, ITSM и т.д.)"
                - "Управление и автоматизацией (Ansible, Terraform, Jenkins и т.д.)"
                - "Управление разработкой и хранения кода (Gitlab, Jira и т.д.)"
                - "Управление сетевым адресным пространством (DHCP, DNS и т.д.)"
                - "Виртуализация рабочих мест (ВАРМ и VDI)"
                - "Шлюз, Балансировщик, прокси"
                - "СУБД"
                - "Распределенный кэш"
                - "Интеграционная шина  (MQ, ETL, API)"
                - "Файловый ресурс (FTP, NFS, SMB, S3 и т.д.)"
                - "Инфраструктура удаленного доступа"
                - "Коммуникации (АТС, Почта, мессенджеры, СМС шлюзы и т.д.)"
                - "Серверы приложений и т.д."
            high_availability:
              title: Параметры отказоустойчивости
              description: >
                Отказоустойчивость - это способность объекта сохранять работоспособность
                в случае отказа одного или нескольких (различных) его компонентов
                в пределах одной зоны доступности.
              type: object
              properties:
                type:
                  title: Высокая доступность объекта управления (HA)
                  description: >
                    Свойство объекта, обозначающее его способность (реализованную)
                    сохранять работоспособность в случае отказа одного или нескольких
                    (различных) его компонентов в пределах одной зоны доступности.
                    \n- "Да" для объекта, построенного на принципах НА
                    \n- "Нет" для объекта, не реализующего НА
                  enum:
                    - Да
                    - Нет
                capacity_reservation_type:
                  title: "Тип резервирования \nв пределах одной зоны доступности"
                  description: >
                    Тип резервирования мощностей в пределах одной зоны доступности.
                    В качестве значений должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - StandBy
                    - Active
                capacity_management:
                  title: "Полнота резервирования \nв пределах одной зоны доступности"
                  description: >
                    В качестве значений должны использоваться значения соответствующего справочника.
                    \n - "Отсутствует" если резервирование не реализовано ни для одного из компонентов объекта
                    \n - "Частичное" если:
                    \n             * резервирование реализовано не для всех компонентов объекта,
                    \n             * либо для некоторых компонентов вычислительные мощности зарезервированы не в полном объеме,
                    \n             * либо для statefull компонентов данные зарезервированы не в полном объеме
                    \n - "Полное" если вычислительные мощности зарезервированы в полном объеме для всех компонентов,
                    и для statefull компонентов данные зарезервированы в полном объеме
                  enum:
                    - Отсутствует
                    - Частичное
                    - Полное
              required:
                - type
                - capacity_reservation_type
                - capacity_management
            availabilityzone:
              title: Зоны доступности
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
            location:
              title: Локации
              description: ЦОДы или офисы, где размещён сервис
              type: array
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                  - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
            network_connection:
              title: Сетевые подключения
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.networks.network"
          required:
            - service_type
            - network_connection
