entities:
  seaf.company.ta.components.hw_storages:
    menu: >
      (
        $entity_id := "seaf.company.ta.components.hw_storages";
        $domain_id := "seaf.company.ta";
        $root_menu := $seaf_fn_get_root_menu($."seaf.configs", $domain_id);
        $root_menu_order := $seaf_fn_get_root_menu_order($."seaf.configs", $domain_id);
        $menu := $seaf_fn_generate_menu_item("Компоненты/Аппаратные СХД", $root_menu);
        [
          (
            $legacy := $lookup($, "seaf.ta.components.hw_storage");
            $exists($lookup($, $entity_id)) or ($exists($legacy) and $count($keys($legacy)) > 0)
          )
          ? {
              "link": "/entities/" & $entity_id & "/list",
              "location": $menu,
              "order": $root_menu_order + 300
            }
        ]
      )

