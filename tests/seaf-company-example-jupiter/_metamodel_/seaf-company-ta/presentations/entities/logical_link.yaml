entities:
  seaf.company.ta.services.logical_links:
    presentations:
      list:
        title: Логические связи
        type: table
        headers:
          - value: title
            text: Название
            link: link
          - value: source
            text: Источник
            link: source_link
          - value: targets
            text: Приёмники
          - value: direction
            text: Направление
        origin:
          links: seaf.company.ds.ta.logical_links
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            links.*@$.{
              "id": __id__,
              "link": "/entities/" & __entity_id__ & "/card?id=" & __id__,
              "title": title,
              "source": $lookup(objects, source).title,
              "source_link": $exists($lookup(objects, source)) ? "/entities/" & $lookup(objects, source).__entity_id__ & "/card?id=" & $lookup(objects, source).__id__ : null,
              "targets": (
                $exists(target)
                  ? (
                      $type(target) = "array"
                        ? target
                        : [target]
                    ).(
                        $obj := $lookup(objects, $);
                        $exists($obj) ? $obj.title : $
                      ) ~> $join(", ")
                  : ""
              ),
              "direction": direction
            }
          )

      card:
        title: Карточка логической связи
        widgets:
          header:
            align: "^"
            presentation: header
            order: 0
            style:
              margin: 0px
              padding: 0px
              border: false
          details:
            title: Атрибуты
            presentation: logical_link_details
            align: "v"
            order: 10
          topology:
            title: Схема связей
            presentation: logical_link_topology
            align: "v"
            order: 20
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        type: mkr-grid
        origin:
          core_objects: seaf.ds.objects
          all_ta_objects: seaf.company.ds.ta.all_objects
        source: >
          (
            $obj := $lookup(core_objects, $params.id);
            $exists($obj.__id__)
              ? $seaf_fn_combine_widgets($self, $obj.__entity_id__, $obj.__id__)
              : (
                  $obj_all := $lookup(all_ta_objects, $params.id);
                  $exists($obj_all.__id__)
                    ? $seaf_fn_combine_widgets($self, $obj_all.__entity_id__, $obj_all.__id__)
                    : { "type": "rows", "items": [] }
                )
          )

      header:
        type: markdown
        template: ../../../seaf-company-base/_shared/templates/header.md
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            /*  ищем объект для презентации */
            $obj2present := $lookup(objects, $params.id);
            {
              "entity": $obj2present.__entity_title__,
              "title": $obj2present.title
            }
          )
