entities:
  kadzo.ta_props:
    title: Набор свойств для объектов ТА
    schema:
      $defs:
        kadzo.includes.softwares:
          title: Программное обеспечение
          type: object
          properties:
            softwares:
              title: Используемое ПО
              type: array
              minItems: 1
              items:
                oneOf:
                  - $ref: "#/$rels/kadzo.softwares.software"
        kadzo.tech_component.type:
          title: Тип компонента
          type: object
          properties:
            type:
              title: Тип компонента
              type: string
              enum:
                - Фронт (web-приложение)
                - Фронт (мобильное приложение)
                - Фронт (десктопное приложение)
                - Шлюз
                - Proxy
                - Балансировщик
                - Распределенный кеш
                - Web сервер
                - Серверное приложение
                - Микросервис
                - Функция (serverless function)
                - Консольное приложение
                - Shell-скрипт
                - ETL
                - Интеграционный компонент
                - Очередь сообщений (message queue)
                - База данных
                - Файловый ресурс
                - Облачное хранилище
                - Прочее

        kadzo.ta_props.ha:
          title: Параметры отказоустойчивости
          type: object
          properties:
            high_availability:
              title: Параметры отказоустойчивости
              description: >
                Отказоустойчивость - это способность объекта сохранять работоспособность в случае отказа одного или нескольких (различных) его компонентов в пределах одной зоны доступности.
              type: object
              properties:
                type:
                  title: Высокая доступность объекта управления (HA)
                  description: >
                    Свойство объекта, обозначающее его способность (реализованную) сохранять работоспособность в случае отказа одного или нескольких (различных) его компонентов в пределах одной зоны доступности.
                    \n- "Да" для объекта, построенного на принципах НА
                    \n- "Нет" для объекта, не реализующего НА
                  enum:
                    - Да
                    - Нет
                capacity_reservation_type:
                  title: "Тип резервирования \nв пределах одной зоны доступности"
                  description: >
                    Типа резервирования мощностей в пределах одной зоны доступности.
                    В качестве значений должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - StandBy
                    - Active
                capacity_management:
                  title: "Полнота резервирования \nв пределах одной зоны доступности"
                  description: >
                    В качестве значений должны использоваться значения соответствующего справочника.
                    \n - "Отсутствует" если резервирование не реализовано ни для одного из компонентов объекта
                    \n - "Частичное" если:
                    \n             * резервирование реализовано не для всех компонентов объекта,
                    \n             * либо для некоторых компонентов вычислительные мощности зарезервированы не в полном объеме,
                    \n             * либо для statefull компонентов данные зарезервированы не в полном объеме
                    \n - "Полное" если вычислительные мощности зарезервированы в полном объеме для всех компонентов, и для statefull компонентов данные зарезервированы в полном объеме
                  enum:
                    - Отсутствует
                    - Частичное
                    - Полное
              required:
                - type
                - capacity_reservation_type
                - capacity_management

        kadzo.ta_props.dr:
          title: Параметры катастрофоустойчивости
          type: object
          properties:
            disaster_recovery:
              title: Катастрофоустойчивость
              description: >
                Катастрофоустойчивость - это способность объекта сохранять работоспособность в случае недоступности одной из площадок (ЦОД), в которой размещен объект (или его компоненты).
              type: object
              properties:
                type:
                  title: Катастрофоустойчивость объекта управления (DR)
                  description: >
                    Свойство объекта, обозначающее его способность (реализованную) сохранять работоспособность в случае недоступности одной из площадок (ЦОД), в которой размещен объект (или его компоненты).
                    \n- "Да" если объект зарезервирован в различных зонах доступности
                    \n- "Нет" если объект не зарезервирован в различных зонах доступности
                  enum:
                    - Да
                    - Нет
                capacity_reservation_type:
                  title: "Тип резервирования \nв резервных зонах доступности"
                  description: >
                    Тип резервирования мощностей в нескольких (различных) зонах доступности
                    В качестве значений данной аналитики должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - StandBy
                    - Active
                capacity_management:
                  title: "Полнота резервирования \nв резервных зонах доступности"
                  description: >
                    В качестве значений данной аналитики должны использоваться значения соответствующего справочника.
                    \n - "Отсутствует" если резервирование не реализовано ни для одного из компонентов объекта
                    \n - "Частичное" если:
                    \n             * резервирование реализовано не для всех компонентов объекта,
                    \n             * либо для некоторых компонентов вычислительные мощности зарезервированы не в полном объеме,
                    \n             * либо для statefull компонентов данные зарезервированы не в полном объеме
                    \n - "Полное" если вычислительные мощности зарезервированы в полном объеме для всех компонентов, и для statefull компонентов данные зарезервированы в полном объеме
                  enum:
                    - Отсутствует
                    - Частичное
                    - Полное
              required:
                - type
                - capacity_reservation_type
                - capacity_management

        kadzo.ta_props.scalability:
          title: Параметры масштабируемости
          type: object
          properties:
            scalability:
              title: Масштабируемость
              description: >
                Способ (стратегия) обеспечения масштабируемости объекта.
                В качестве значений данной аналитики должны использоваться значения соответствующего справочника.
              enum:
                - Нет
                - Вертикальная
                - Горизонтальная
                - Вертикальная и горизонтальная
        #          required:
        #            - scalability

        kadzo.ta_props.backup:
          title: Параметры бекапирования
          type: object
          properties:
            backup:
              type: object
              title: Бекапирование
              description: >
                Параметры бэкапирования для данного объекта
              properties:
                placement:
                  title: "Резервное копирование \n(место хранение бекапа)"
                  description: >
                    Место хранения резервной копии данных объекта.
                    В качестве значений данной аналитики должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - ЦОД
                    - Резервный ЦОД
                    - Offsite
                backup_placement:
                  title: "Резервное копирование дубликата \n(место хранения дубликата резервной копии)"
                  description: >
                    Место хранения дубликата (второго экземпляра) резервной копии объекта.
                    В качестве значений данной аналитики должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - ЦОД
                    - Резервный ЦОД
                    - Offsite
              required:
                - placement
                - backup_placement

        kadzo.ta_props.monitoring:
          title: Мониторинг
          type: object
          properties:
            monitoring:
              title: Мониторинг
              description: >
                Средства мониторинга, применяемые для данного объекта.
              type: string