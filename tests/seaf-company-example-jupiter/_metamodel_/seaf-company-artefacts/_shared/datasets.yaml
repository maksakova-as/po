# В этом разделе дополняем параметры общих датасетов, объявленных в модуле seaf-common,
# чтобы объекты нашего модуля появились в этих датасетам и с ними можно было работать стандартным образом
datasets:
  seaf.ds.entities:
    origin:
      # перечисляем SEAF сущности нашего модуля
      seaf_entities:
        - seaf.company.artefacts

      # перечисляем сущности внешних (не SEAF) модулей, с которыми мы работаем в нашем модуле
#      non_seaf_entities: []

  seaf.ds.objects_links:
    origin:
      attr2check:
        # задаем массив имен атрибутов сущностей нашего модуля, в которых может встречаться ссылка на объект
        # (такая ссылка задается в схеме выражением типа $ref: "#/$rels/seaf.company.app.systems.system")
        # если не задать имя атрибута, то по такому атрибуту - если в нем была ссылка на объект - данная информация не попадет
        # в датасет seaf.ds.objects_links
        - activity
        - artefact
        - object
