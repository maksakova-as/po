entities:
  seaf.company.ta.services.dcs:
    presentations:
      list:
        title: Центры обработки данных
        type: table
        headers:
          - value: title
            text: Название
            link: link
          - value: description
            text: Описание
          - value: id
            text: ID
          - value: availability_zone_title
            text: Зона доступности
            link: availability_zone_link
          - value: region_title
            text: Регион
          - value: vendor
            text: Провайдер
          - value: ownership
            text: Тип владения
          - value: type
            text: Тип ЦОДа
          - value: tier
            text: Tier
        origin:
          dcs: seaf.company.ds.ta.dcs
          azs: seaf.company.ds.ta.dc_azs
          regions: seaf.company.ds.ta.dc_regions
        source: >
          (
            $dcs := dcs;
            $azs := azs;
            $regions := regions;
            $dcs.*@$dc.(
              $az := $lookup($azs, $dc.availabilityzone);
              $region := $exists($az) ? $lookup($regions, $az.region) : {};
              {
                "id": $dc.__id__,
                "link": "/entities/" & $dc.__entity_id__ & "/card?id=" & $dc.__id__,
                "title": $dc.title,
                "description": $dc.description,
                "availability_zone_title": $az.title,
                "availability_zone_link": $exists($az)
                  ? "/entities/" & $az.__entity_id__ & "/card?id=" & $az.__id__
                  : null,
                "region_title": $region.title,
                "vendor": $dc.vendor,
                "ownership": $dc.ownership,
                "type": $dc.type,
                "tier": $dc.tier
              }
            )[];
          )

      card:
        title: Карточка ЦОДа
        widgets:
          header:
            align: "^"
            presentation: header
            order: 0
            style:
              margin: 0px
              padding: 0px
              border: false
          details:
            title: Атрибуты
            presentation: dc_card_details
            align: "v"
            order: 10
          topology:
            title: AZ и регион
            presentation: dc_topology
            align: "v"
            order: 20
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        type: mkr-grid
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            $obj := $lookup(objects, $params.id);
            $exists($obj.__id__)
              ? $seaf_fn_combine_widgets($self, $obj.__entity_id__, $obj.__id__)
              : { "type": "rows", "items": [] };
          )

      header:
        type: markdown
        template: ../../../seaf-company-base/_shared/templates/header.md
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            /*  ищем объект для презентации */
            $obj2present := $lookup(objects, $params.id);
            {
              "entity": $obj2present.__entity_title__,
              "title": $obj2present.title
            }
          )
