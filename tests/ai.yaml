      products:
        title: Продукты
        type: gigachat
        model: GigaChat-2
        system_prompt: |
          Ты бот-консультант продуктового магазина.
          Помни, что у тебя есть следующие функции:
          get_products: Получает текущие позиции в магазине
          get_product_info: Получает информацию о продукте (цена, количество)
          Помни:
          - ты можешь вызывать функции последовательно
          - перед вызовом функций, обязательно перепроверь передаваемые в нее параметры
        tools:
          - name: get_products
            query: >
              (
                  $log($string($params), "========= GET PRODUCT");
                  $mock_data := $.ai_fn_test_data;
              
                  $map($mock_data, function($v){(
                      {"name": $v.name, "id": $v.id}
                  )});
              )
            schema:
              name: get_products
              description: Получает какие продукты есть в магазине
              parameters:
                type: object
                properties:
                  arg:
                    type: string
              return_parameters:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                      description: ID продуктов
          - name: get_product_info
            query: >
              (
                  $log($string($params), "========= GET PRODUCT INFO");
                  $mock_data := $.ai_fn_test_data;
              
                  $mock_params := {"ids":[1]};
              
                  $filter($mock_data, function($v, $i, $a) {
                      $v.id in $params.ids
                  })         
              )
            schema:
              name: get_product_info
              description: Получает информацию об определенном продукте в магазине
              parameters:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                      description: ID продуктов
              return_parameters:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Название позиции
                        id:
                          type: string
                          description: ID позиции
                        quantity:
                          type: string
                          description: Количество
                        price:
                          type: string
                          description: Цена


      random:
        title: Random
        type: gigachat
        model: GigaChat-2
        system_prompt: |
          Ты генератор случайных рандомных чисел.
          Помни, что у тебя есть следующие функции:
          get_random: Генерирует случайных число
          Помни: 
          - На любой запрос пользователя ты возращаешь случайное число
          - В качестве ответа пользователю ты возращаешь результат выполнения функции, без добавления текста

        tools:
          - name: get_random
            query: >
              (100500)
            schema:
              name: get_random
              description: Генерирует случайное число
              parameters:
                type: object
                properties:
                required:
              return_parameters:
                type: object
                properties:
                  number:
                    type: integer
                    description: Случайное целое число
                required:
                  - number


      calculator:
        title: Калькулятор
        type: gigachat
        model: GigaChat-2

        system_prompt: |
          Ты калькулятор позволяющий производить расчеты по функции "x + y - z".
          
          z - число введенное пользователем.
          x и y следует получить с использованием соответствующих функций.
          
          Если пользователь ввел не число верни ответ:
          "Введите число"
          
          Помни, что у тебя есть следующие функции:
          get_x: получения значение x
          get_y: получения значение y
          calc: производит вычисление 
          
          Помни:
          - ты можешь вызывать функции последовательно
          - перед вызовом функций, обязательно перепроверь передаваемые в нее параметры
          - ты не проверяешь корректность расчета, а только возвращаешь пользователю результата вычисления calc 

        tools:
          - name: get_x
            query: >
              (100)
            schema:
              name: get_x
              description: Получает значение x
              parameters:
                type: object
                properties:
                required:
              return_parameters:
                type: object
                properties:
                  number:
                    type: number
                    description: Значение x
                required:
                  - number

          - name: get_y
            query: >
              (300)
            schema:
              name: get_y
              description: Получает значение y
              parameters:
                type: object
                properties:
                required:
              return_parameters:
                type: object
                properties:
                  number:
                    type: number
                    description: Значение y
                required:
                  - number

          - name: calc
            query: >
              (
                $x := $number($params.x);
                $y := $number($params.y);
                $z := $number($params.z);
              
                $x + $y - $z
              )
            schema:
              name: calc
              description: Производит вычисление
              parameters:
                type: object
                properties:
                  x:
                    type: number
                    description: Значение x
                  y:
                    type: number
                    description: Значение y
                  z:
                    type: number
                    description: Значение z
                required:
                  - x
                  - y
                  - z
              return_parameters:
                type: object
                properties:
                  number:
                    type: number
                    description: Результат вычисления
                required:
                  - number

      notools:
        title: NO TOOLS
        type: gigachat
        model: GigaChat-2
        system_prompt: |
          Ты ИИ - ассистент.

