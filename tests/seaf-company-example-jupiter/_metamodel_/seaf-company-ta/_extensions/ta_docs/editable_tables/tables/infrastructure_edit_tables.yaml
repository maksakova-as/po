docs:
  seaf.company.ta.docs.storages.edit:
    type: editable-table
    location: /Техническая архитектура/Сервисы/Инфраструктура/Хранилища/Изменение хранилищ
    description: Редактирование хранилищ из architecture/ta/storage.yaml
    page_size: 12
    filtration: true
    selection: false

    origin:
      storages: seaf.company.ds.ta.storages
      azs: seaf.company.ds.ta.dc_azs
      networks: seaf.company.ds.ta.networks
      softwares: seaf.company.ds.ta.software
      stands: seaf.company.ds.ta.stands
      stand_options: seaf.company.ds.ta.stand_options
      dcs: seaf.company.ds.ta.dcs

    headers:
      - value: id
        text: ID
        width: 260px
        filterable: false
        sortable: false

      - value: title
        text: Название
        width: 220px
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: description
        text: Описание
        width: 300px
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: type
        text: Тип
        width: 220px
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: softwares
        text: Программное обеспечение
        width: 280px
        type: multiple-select
        options: >
          (
            $items := $exists(softwares) ? softwares : {};
            $map($keys($items), function($id){(
              $entry := $lookup($items, $id);
              {
                "value": $id,
                "text": $entry.title ? $entry.title : $id
              }
            )})
          )
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: availabilityzone
        text: Зоны доступности
        width: 250px
        type: multiple-select
        options: >
          (
            $azs := $exists(azs) ? azs : {};
            $map($keys($azs), function($az_id){(
              $az := $lookup($azs, $az_id);
              {
                "value": $az_id,
                "text": $az.title ? $az.title : $az_id
              }
            )})
          )
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: network_connection
        text: Сеть
        width: 260px
        type: multiple-select
        options: >
          (
            $nets := $exists(networks) ? networks : {};
            $map($keys($nets), function($net_id){(
              $net := $lookup($nets, $net_id);
              {
                "value": $net_id,
                "text": $net.title ? $net.title : $net_id
              }
            )})
          )
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: stand
        text: Стенды
        width: 200px
        type: multiple-select
        options: >
          (
            $opts := $exists(stand_options) ? stand_options : [];
            $type($opts) = "array" ? $opts : ($exists($opts) ? [$opts] : [])
          )
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: location
        text: Локация
        width: 260px
        type: multiple-select
        options: >
          (
            $locs := $exists(dcs) ? dcs : {};
            $map($keys($locs), function($loc_id){(
              $loc := $lookup($locs, $loc_id);
              {
                "value": $loc_id,
                "text": $loc.title ? $loc.title : $loc_id
              }
            )})
          )
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: sla
        text: SLA
        width: 140px
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

      - value: external_id
        text: Внешний ID
        width: 160px
        editable: true
        save:
          path: ../../../../architecture/ta/storage.yaml

    source: >
      (
        $entries := $exists(storages) ? storages : {};
        $to_array := function($value){
          $type($value) = "array"
            ? $value
            : ($exists($value) ? [$value] : [])
        };
        $rows := $map($keys($entries), function($id){(
          $entry := $lookup($entries, $id);
          {
            $id: {
              "id": $id,
              "title": $entry.title,
              "description": $entry.description,
              "type": $entry.type,
              "softwares": $exists($entry.softwares)
                ? $to_array($entry.softwares)
                : ($exists($entry.software) ? [$entry.software] : []),
              "availabilityzone": $to_array($entry.availabilityzone),
              "network_connection": $to_array($entry.network_connection),
              "stand": $to_array($entry.stand),
              "location": $to_array($entry.location),
              "sla": $entry.sla,
              "external_id": $entry.external_id
            }
          }
        )}) ~> $merge();
        {
          "body": $rows
        }
      )

    format: >
      (
        $table := $exists(table) ? table : {};
        $to_array := function($value){
          $type($value) = "array"
            ? $value
            : ($exists($value) ? [$value] : [])
        };
        $rows := $map($keys($table), function($id){(
          $row := $lookup($table, $id);
          {
            $id: {
              "title": $row.title,
              "description": $row.description,
              "type": $row.type,
              "softwares": $to_array($row.softwares),
              "availabilityzone": $to_array($row.availabilityzone),
              "network_connection": $to_array($row.network_connection),
              "stand": $to_array($row.stand),
              "location": $to_array($row.location),
              "sla": $row.sla,
              "external_id": $row.external_id
            }
          }
        )}) ~> $merge();
        {
          "seaf.company.ta.services.storages": $rows
        }
      )

