rules:
  validators:
    seaf.validation.ta.services.kb_connection_check:
      uid: SEAF-TA-KB-CONN-001
      title: Проверка корректности связи Сервиса КБ с сетями
      description: |
        Проверяет, что у каждого Сервиса КБ (seaf.company.ta.services.kb)
        указано поле `network_connection`, оно не пустое и каждый его элемент
        ссылается на реально существующую сеть.
      correction: |
        Убедитесь, что для каждого объекта типа `seaf.company.ta.services.kb` указано
        непустое поле `network_connection` и что каждая указанная сеть
        определена в `seaf.company.ta.services.networks`.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.services.kb_connection_check";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $ds := $.datasets."seaf.company.ds.ta.kb";
                  $entities := $eval($ds.source, { "objects": $, "data_lake": $ });
                  $net_ds := $.datasets."seaf.company.ds.ta.networks";
                  $networks := $eval($net_ds.source, { "objects": $, "data_lake": $ });
                  $each($entities, function($kb_service, $kb_key) {
                    (
                        $connections := $kb_service.network_connection;
                        $not($exists($connections)) or $count($connections) = 0 ? {
                            "uid": "seaf.validation.ta.kb_connection_check.missing." & $kb_key,
                            "title": "У Сервиса КБ '" & $kb_service.title & "' отсутствует или не заполнено поле network_connection.",
                            "correction": "ID: " & $kb_key & ". " & ("Необходимо указать хотя бы одну сеть для поля `network_connection`."),
                            "description": "У Сервиса КБ '" & $kb_service.title & "' (UID: " & $kb_key & ") отсутствует или не заполнено поле `network_connection`."
                        } : (
                            $defined_network_keys := $keys($networks);
                            $invalid_connections := $filter($connections, function($c) { $not($c in $defined_network_keys) });
                            $count($invalid_connections) > 0 ? {
                                "uid": "seaf.validation.ta.kb_connection_check.notfound." & $kb_key,
                                "title": "Сервис КБ '" & $kb_service.title & "' содержит ссылку на несуществующую сеть.",
                                "correction": "ID: " & $kb_key & ". " & ("Проверьте все сети в поле `network_connection` для сервиса '" & $kb_service.title & "'. Одна или несколько из них не определены в `seaf.company.ta.services.networks`."),
                                "description": "Сервис КБ '" & $kb_service.title & "' (UID: " & $kb_key & ") ссылается на несуществующие сети: " & $join($invalid_connections, ", ")
                            }
                        )
                    )
                  })
                )
              ])
            )
            : []
        )
