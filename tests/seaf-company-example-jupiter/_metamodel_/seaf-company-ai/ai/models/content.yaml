seaf.company.ai.models:

  sber.ai_model.gigachat_lite:
    title: GigaChat Lite
    description: >
      Быстрая и легкая модель для простых повседневных задач.
      Работа с моделью через GigaChat API
    purposes:
      - fast_interactive_responses
      - lightweight_generations
    vendor: Сбер СалютДевайсы
    version: 2.0
    delivery_type: Public SaaS
    architecture: transformer
    training_datasets:
      - LITRES_CORPUS
      - WIKIPEDIA_RU
    hyperparameters:
      context_window_tokens: 128000
    created_at: 2023.01.01
    realized_in: sber.systems.gigachat

  sber.ai_model.gigachat_pro:
    title: GigaChat Pro
    description: >
      Усовершенствованная модель для ресурсоемких задач, обеспечивающая максимальную эффективность
      в обработке данных, креативности и соблюдении инструкций.
      Работа с моделью через GigaChat API
    purposes:
      - advanced_dialogues
      - multi-domain_task_performance
    vendor: Сбер СалютДевайсы
    version: 2.0
    delivery_type: Public SaaS
    architecture: transformer
    training_datasets:
      - Q&A_CORPUS
      - CODE_SNIPPET_COLLECTION
    hyperparameters:
      context_window_tokens: 128000
    created_at: 2023.03.15
    realized_in: sber.systems.gigachat

  sber.ai_model.gigachat_max:
    title: GigaChat Max
    description: >
      Мощная модель для самых сложных и масштабных задач, требующих высочайшего уровня креативности
      и качества исполнения.
      Работа с моделью через GigaChat API
    purposes:
      - large_scale_generation
      - high_precision_results
    vendor: Сбер СалютДевайсы
    version: 2.0
    delivery_type: Public SaaS
    architecture: transformer
    training_datasets:
      - WEB_DOCUMENTS_RU
      - BOOK_SUMMARIES
    hyperparameters:
      context_window_tokens: 128000
    created_at: 2023.06.01
    realized_in: sber.systems.gigachat

  sber.ai_model.gigachat_embeddings:
    title: GigaChat Embeddings
    description: >
      Модель предназначена для формирования высококачественных представлений текста в виде численных векторов
      (эмбеддингов), используемых для расчёта сходства документов и анализа семантической близости.
      Работа с моделью через GigaChat API
    purposes:
      - text_vector_representation
      - similarity_calculation
    vendor: Сбер СалютДевайсы
    version: 1.0
    delivery_type: Public SaaS
    architecture: transformer
    training_datasets:
      - TEXT_SIMILARITY_CORPUS
      - DOCUMENT_COLLECTION
    hyperparameters:
      context_window_tokens: 512
    created_at: 2023.04.01
    realized_in: sber.systems.gigachat

  sber.ai_model.gigachat_embeddings_gigar:
    title: GigaChat EmbeddingsGigaR
    description: >
      Усовершенствованная версия предыдущей модели с увеличенными ресурсами обработки больших объемов данных и 
      повышенной точностью вычисления семантического соответствия.
      Работа с моделью через GigaChat API
    purposes:
      - advanced_embedding_generation
      - large-scale_semantic_analysis
    vendor: Сбер СалютДевайсы
    version: 1.0
    delivery_type: Public SaaS
    architecture: transformer
    training_datasets:
      - BIG_WEB_CORPUS
      - SCIENTIFIC_PAPERS
    hyperparameters:
      context_window_tokens: 4096
    created_at: 2023.05.15
    realized_in: sber.systems.gigachat

