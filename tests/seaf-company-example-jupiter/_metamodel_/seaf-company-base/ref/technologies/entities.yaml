entities:
  seaf.company.technologies:
    title: &entity_title Технологии
    description: &entity_description |
      Технология — это совокупность методов, спецификаций, инструментов, используемых компанией для преобразования
      материалов, энергии и информации в продукты и услуги, необходимые обществу.
      В общем случае технология охватывает широкий спектр областей человеческой деятельности, включая ИТ и телеком,
      производство, сельское хозяйство, транспорт, здравоохранение, образование и др.
      \n Используйте ключ (идентификатор) объекта вида: 
      \n <компания>.<тип_технологии>.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - <тип_технологии> - например software, protocol или просто technology. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    objects:
      technology:
        route: "/"
        title: Технология
        symbol: technology

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          # additionalProperties: false
          # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
          # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"

          required:
            - type

          properties:
            is_part_of:
              title: Является частью
              description: Используется для задания древовидной структуры объектов
              $ref: "#/$rels/seaf.company.technologies.technology"

            type:
              title: Тип
              description: |
                Форма представления технологии. Варианты:
                \n - Метод - технология описана в виде метода, алгоритма, сценария. 
                Является идеей, описанной в документе, не имеет физического воплощения.
                \n - Архитектура - технология описана в виде концепции, структуры, набора спецификаций
                (например, архитектура процессора OpenRISC). 
                Является идеей, описанной в документе, не имеет физического воплощения.
                \n - Протокол - формальный протокол\спецификация, предназначеннный для обмена информацией\сигналами между 
                техническими компонентами. Воплощен, как правило, в виде стандарта, опубликованной спецификации.
                \n - Язык - язык общения человека с техническими элементами (например, язык программирования).
                Описан, как правило, в виде опубликованной спецификации.
                \n - Программное средство - программный продукт, библиотека ПО, SDK, фреймворк и т.п.
                \n - Аппаратное средство - электронное устройство, вычислительное средство и т.п.
                \n - Механическое средство - механическое устройство, конструкция и т.п.
                \n\n Если технология реализована в нескольких формах, то внесите несколько значений в массив

              type: array
              minItems: 1
              items:
                type: string
                enum:
                  - Метод
                  - Архитектура
                  - Протокол обмена
                  - Язык
                  - Программное средство
                  - Аппаратное средство
                  - Механическое средство

            status:
              title: Статус
              description: |
                Статус использования технологии в компании:
                \n - ADOPT - Рекомендовано для активного внедрения в новые проекты. Технология зрелая, проверенная в компании.
                \n - TRIAL - Перспективная технология, находящаяся в стадии апробации. Использовать с осторожностью в подходящих проектах.
                \n - HOLD - Зрелая, стабильная технология, но не рекомендуемая для новых проектов. Поддержка и исправление ошибок.
                \n - DEPRECATE - Устаревшая или нерекомендуемая технология. Запрещена для новых проектов. Необходим план миграции.
              type: string
              enum:
                - ADOPT
                - TRIAL
                - HOLD
                - DEPRECATE

            tags:
              title: Теги
              description: Теги для категоризации
              type: array
              items:
                type: string

            version:
              title: Версия
              description: Версия технологии
              type: [string, number]

            dependencies:
              title: Зависимости
              type: array
              description: Зависимости данной технологии от других технологий
              items:
                type: string
                $ref: "#/$rels/seaf.company.technologies.technology"

            vendor:
              type: object
              description: Информация о вендоре/поставщике
              properties:
                title:
                  title: Название
                  description: Название компании-вендора
                  type: string
                website:
                  title: Вебсайт
                  description: Вебсайт вендора технологии
                  type: string
                  format: uri

            license:
              title: Лицензия
              description: |
                Тип лицензии. Выбирайте из справочника или введите свое значение
              anyOf:
                - type: string
                  enum:
                    - Не лицензируется
                    - Внутригрупповая
                    - Коммерческая
                    - Подписка
                    - Корпоративное соглашение
                    - Open Source
                    - Freemium
                    - Freeware
                    - Shareware
                - type: string
                  minLength: 2

            references:
              title: Ссылки на материалы
              description: |
                Ресурсы с полезной информацией по данной технологии
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  title:
                    title: Название
                    description: Краткое название материала
                    type: string
                  url:
                    title: URL ссылка
                    description: Ссылка на документ (если отсутсвует соотв. артефакт в арх. репозитории)
                    type: string
                    format: uri
                  type:
                    title: Тип
                    description: |
                      Тип материала.
                      \nВыбирайте из справочника или вводите свой вариант
                    anyOf:
                      - type: string
                        enum:
                          - Домашняя страница
                          - Git репозиторий
                          - Дистрибутив
                          - Документация
                          - Группа обсуждения
                      - type: string
                        minLength: 3

                  description:
                    title: Описание
                    description: Дополнительное описание ресурса
                    type: string