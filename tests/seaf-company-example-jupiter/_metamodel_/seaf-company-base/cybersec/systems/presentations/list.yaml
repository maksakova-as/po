    presentations:
      list:
        title: Список
        type: table

        headers:
          - value: id
            text: Идентификатор
            link: link
          - value: title
            text: Название
            align: left
            link: link
          - value: class
            text: Класс
            align: left
#          - value: criticality_level
#            text: Критичность
#            align: left
          - value: description
            text: Описание
            align: left
          - value: location
            text: Размещение
            align: left
          - value: lifecycle_stage
