# Назначение: Подготовка датасета `kadzo.ds.ta.backups` (backups) в контуре kadzo.
# Используется: ta/dataset_parts/* и объединенные TA-таблицы через reverse2seaf2.ds.ta.kadzo.*.
datasets:
  kadzo.ds.ta.backups:
    source: >
      (
        $services := data_lake."kadzo.v2023.tech_services";
        $target_classes := ["Системы резервного/архивного копирования"];
        
        $services.$spread().(
          $id := $keys()[0];
          $obj := $.*[0];
          
          $is_target := $obj.class in $target_classes;
          
          $is_target ? {
            "kadzo.backup." & $id : {
              "__id__": "kadzo.backup." & $id,
              "__entity_id__": "seaf.company.ta.services.backups",
              "__entity_title__": "Сервис резервного копирования",
              "title": $obj.title,
              "description": $obj.description,
              "app_components": $obj.provides ? $obj.provides : [],
              "path": "/",
              "location": [],
              "availabilityzone": [],
              "network_connection": [],
              "backed_up_services": [],
              "source": "kadzo",
              "legacy_id": $id
            }
          } : {}
        ) ~> $merge()
      )
