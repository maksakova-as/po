rules:
  validators:
    seaf.validation.ta.p3.k8s_allowed_registries:
      uid: SEAF-TA-P3-K8S-REGISTRIES
      title: "[TACCS_1-P10-29-04] Наличие ссылок на целевые реестры/репозитории (registries)"
      description: |
        Кластер должен быть включён в KB-сервисы с `tag=Repo|Registry` через `protected_services`.
        Так мы контролируем, что образы поступают только из доверенных хранилищ.
      correction: |
        Добавьте кластер в нужный KB-сервис (Repo/Registry) и проверьте совпадение сетей.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.p3.k8s_allowed_registries";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
          $cfg_root2 := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
          $company_ids := $keys($cfg_root2.company ? $cfg_root2.company : ($configs.company ? $configs.company : {}));
          $has_company_filter := $count($company_ids) > 0;
          $is_local := function($obj, $key){
            $has_company_filter
              ? (
                  ($exists($obj.__company_id__) and $obj.__company_id__ in $company_ids)
                  or ($substringBefore($key, ".") in $company_ids)
                )
              : (
                  $not($exists($obj.source)) or $obj.source = "seaf2"
                )
          };
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $code := "TACCS_1-P10-29-04";
                  $kb_ds := $.datasets."seaf.company.ds.ta.kb";
                  $kb := $eval($kb_ds.source, { "objects": $, "data_lake": $ });
                  $k8s_ds := $.datasets."seaf.company.ds.ta.k8s";
                  $k8s := $eval($k8s_ds.source, { "objects": $, "data_lake": $ });
                  $registry_services :=
                    $filter(
                      $map($keys($kb), function($svc_key){
                        (
                          $svc := $lookup($kb, $svc_key);
                          (($svc.tag = "Repo" or $svc.tag = "Registry") and $exists($svc.protected_services)) ? {
                            "key": $svc_key,
                            "svc": $svc
                          }
                        )
                      }),
                      function($entry){ $type($entry) = "object" }
                    );
                  $each($k8s, function($k, $k_key){
                    (
                      $not($is_local($k, $k_key)) ? [] :
                      $nets := $distinct((($k.network_connection) or []) ~> $append($k.management_networks));
                      $registry_refs := $filter($registry_services, function($entry){
                        $k_key in $entry.svc.protected_services
                      });
                      ($count($registry_refs)=0) ? {
                        "uid": "seaf.validation.ta.p3.k8s_allowed_registries.missing." & $k_key,
                        "deviation_id": $code & ":" & "seaf.validation.ta.p3.k8s_allowed_registries.missing." & $k_key,
                        "title": "K8s '" & $k.title & "' не привязан к Repo/Registry",
                        "correction": "ID: " & $k_key & ". " & ("Добавьте кластер в protected_services сервисов tag=Repo|Registry"),
                        "description": "Кластер отсутствует в KB-реестрах"
                      } : (
                        $issues := $map($registry_refs, function($entry){
                          (
                            $svc := $entry.svc;
                            $svc_key := $entry.key;
                            ($exists($nets) and $exists($svc.network_connection)) ? (
                              $common := $filter($nets, function($n){ $n in $svc.network_connection });
                              ($count($common)=0) ? {
                                "uid": "seaf.validation.ta.p3.k8s_allowed_registries.reach." & $k_key & "." & $svc_key,
                                "deviation_id": $code & ":" & "seaf.validation.ta.p3.k8s_allowed_registries.reach." & $k_key & "." & $svc_key,
                                "title": "K8s '" & $k.title & "' и registry '" & $svc.title & "' не делят сети",
                                "correction": "ID: " & $k_key & ". " & ("Выравняйте `network_connection`"),
                                "description": "Регистр: " & $svc_key
                              } : []
                            ) : []
                          )
                        });
                        $filter($issues, function($v){ $type($v) = "object" })
                      )
                    )
                  }) ~> $reduce(function($curr, $acc){
                    (
                      $seq :=
                        ($type($curr) = "array") ? $curr :
                        ($type($curr) = "object") ? [$curr] :
                        [];
                      $seq ~> $reduce(function($value, $inner){
                        $inner ~> $append($value)
                      }, $acc)
                    )
                  }, [])
                )
              ])
            )
            : []
        )
