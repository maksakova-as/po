datasets:
  seaf.company.ds.kadzo:
    # дополняем origin сводного датасета
    origin:
      kadzo.v2023.systems: seaf.company.ds.kadzo.systems

  seaf.company.ds.kadzo.systems:
    title: Системы КАДЗО
    description: Датасет-трансформатор данных из формата SEAF в формат КАДЗО
    origin:
      obj_in: seaf.company.ds.app.systems
      objects_links: seaf.ds.objects_links
      objects: seaf.ds.objects
      kadzo_softwares: seaf.company.ds.kadzo.softwares
      kadzo_groups: seaf.company.ds.kadzo.groups
      kadzo_target_status_enum:
        "Целевая": Целевая
        "Нецелевая": Не целевая

    # Принятые допущения:
    #    - технические системы конвертируем в системы, а не техсервисы КА ДЗО
    #    - мониторинг - берем первое значение из массива
    #    - если система привязана боле чем к 1 категории (группе), то берем 1е значение
    # Что сконвертировать:
    #      change-type:
    #        title: Тип изменений
    #        enum:
    #          - Планируется
    #          - Разрабатывается
    #          - Модифицируется
    #          - Используется
    #          - Выводится из эксплуатации
    #      changes:
    #        title: Описание изменений
    #        type: string

    source: >
      (
      $obj_in := obj_in;
      $objects_links := objects_links;
      $objects := objects;
      $kadzo_softwares := kadzo_softwares;
      $kadzo_groups := kadzo_groups;
      $kadzo_target_status_enum := kadzo_target_status_enum;
      
      $kadzo_groups_list := $kadzo_groups.$keys();
      $kadzo_softwares_list := $kadzo_softwares.$keys();
      
      $obj_out := $each($obj_in, function ($val, $key) {(
          /* готовим данные */
          $monitoring_arr := [$val.monitoring];
          $gr := $filter([$val.categories], function ($val){ $val in $kadzo_groups_list })[0];
          /* Выявляем используемое ПО - проходим по списку технологий */
          $softwares := $filter([$val.uses_technologies.technology], function($tval){ $tval in $kadzo_softwares_list })[];
          /* формируем объект КАДЗО */
          { $key: {
              "title": $val.title,
              "description": $val.description,
              "comments": $val.comments ~> $join("; "),
              "parent": $val.is_part_of,
              "class": $val.class,
              "group": $gr,
              "criticality": $val.criticality_level,
              "location": $val.location,
              "ownership": $val.ownership,
              "live-stage": $val.lifecycle_stage,
              "performance": $val.performance,
              "rto": $val.rto,
              "rpo": $val.rpo,
              "sla": $val.sla,
              "ihci": $val.external_itsm_id,
              "scalability": $val.scalability,
              "high_availability": $val.high_availability,
              "disaster_recovery": $val.disaster_recovery,
              "backup": $val.backup,
              "softwares": $softwares != [] ? $softwares,
      /*        "change-type": [] TODO,*/
      /*        "changes": [] TODO,*/
              "monitoring": $monitoring_arr != [] ? $monitoring_arr[0],
              "target-status": (
                $attr_val := $val.target_status;
                $exists($attr_val) and $attr_val != null ? $seaf_company_fn_kadzo_convert_enum($kadzo_target_status_enum, $attr_val, [$key, "атрибут target_status", $attr_val]);
              )
          }}
              )})[] ~> $merge();
      $obj_out
      )
