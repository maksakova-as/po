# Назначение: Полный агрегат TA-объектов для кросс-доменных представлений, правил и отчётов.
# Используется: presentations, internal_docs, widgets, docs, ta, auto_tests и другие разделы метамодели.
datasets:
  seaf.company.ds.ta.all_objects:
    description: |
      Все объекты технической архитектуры (для визуализаций/схем)
    origin:
      objects: seaf.ds.objects_by_entities
      dcs: seaf.company.ds.ta.dcs
      dc_regions: seaf.company.ds.ta.dc_regions
      dc_azs: seaf.company.ds.ta.dc_azs
      dc_offices: seaf.company.ds.ta.dc_offices
      networks: seaf.company.ds.ta.networks
      network_segments: seaf.company.ds.ta.network_segments
      network_links: seaf.company.ds.ta.network_links
      logical_links: seaf.company.ds.ta.logical_links
      software: seaf.company.ds.ta.software
      compute_services: seaf.company.ds.ta.compute_services
      cluster_virtualizations: seaf.company.ds.ta.cluster_virtualizations
      servers: seaf.company.ds.ta.servers
      storages: seaf.company.ds.ta.storages
      hw_storages: seaf.company.ds.ta.hw_storages
      k8s: seaf.company.ds.ta.k8s
      k8s_namespaces: seaf.company.ds.ta.k8s_namespaces
      k8s_deployments: seaf.company.ds.ta.k8s_deployments
      k8s_hpas: seaf.company.ds.ta.k8s_hpas
      k8s_nodes: seaf.company.ds.ta.k8s_nodes
      backup: seaf.company.ds.ta.backup
      monitoring: seaf.company.ds.ta.monitoring
      kb: seaf.company.ds.ta.kb
      network_components: seaf.company.ds.ta.network_components
      user_devices: seaf.company.ds.ta.user_devices
      environments: seaf.company.ds.ta.environments
      stands: seaf.company.ds.ta.stands
      cfg: seaf.company.ds.ta._config
    source: >
      (
        $sources_enabled := cfg.enabled;
        $data := objects;
        $ta_keys := $filter($keys($data), function($k){ $contains($string($k), "seaf.company.ta") });
        $seaf2_all := "seaf2" in $sources_enabled
          ? (
              $ta_keys.($lookup($data, $))
            ) ~> $merge()
          : {};
        
        $merge([

          $seaf2_all,
          dcs, dc_regions, dc_azs, dc_offices,
          networks, network_segments, network_links, logical_links,
          software,
          compute_services, cluster_virtualizations,
          servers, storages, hw_storages,
          k8s, k8s_namespaces, k8s_deployments, k8s_hpas, k8s_nodes, backup, monitoring, kb,
          network_components, user_devices,
          environments, stands
        ])
      )
