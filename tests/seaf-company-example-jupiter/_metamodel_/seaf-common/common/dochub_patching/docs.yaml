entities:
  docs:
    # Важно:
    # Этот файл патчит только логику меню для раздела "Документы":
    # - не создавать пустой корневой пункт, если нет относительных location;
    # - корректно обрабатывать абсолютные (/...) и относительные location.
    #
    # При этом здесь обязательно держим полный каркас entities.docs
    # (title/config/schema/presentations.blank), иначе при мерже можно потерять
    # presentation "blank" и получить ошибку "Неизвестный тип документа [unknown]"
    # на /entities/docs/blank и /docs/<doc-id>.
    title: Документы
    # Конфигурация
    config:
      root_menu: Документы
    # Патчим формирование меню, чтобы пустые корневые пункты не появлялись
    menu: >
      (
        $root_menu := entities.docs.config.root_menu;
        $append(
          (
            /* Проверяем, есть ли документы с относительными путями меню */
            [$.docs.*.location.$filter($, function($v) { $not($contains($v, /^\//)) })] != []
              ? [
                  {
                    "title": "Документы",
                    "location": $root_menu,
                    "expand": false,
                    "icon": "description"
                  }
                ]
              : []
          ),
          docs.$spread().(
            $location := *.location ~> $substring(0, 1) = "/"
              ? *.location ~> $substring(1)
              : $root_menu & "/" & *.location;
            *.location
              ? {
                  "location": $location,
                  "order": *.order,
                  "link": "entities/docs/blank?dh-doc-id=" & $keys()[0]
                }
          )
        )
      )
    # Схема данных объекта "Документ"
    schema:
      type: object
      patternProperties:
        "^[0-9a-zA-Z][a-zA-Z0-9_-]*(\\.[a-zA-Z][a-zA-Z0-9_-]*)*$":
          type: object
          properties:
            title:
              title: Название документа
              type: string
            location:
              title: Место расположения в меню
              type: string
            icon:
              title: Иконка в меню
              type: string
            type:
              title: Тип документа
              type: string
            subjects:
              title: Принадлежит объектам
              type: array
              items:
                type: string
            template:
              title: Путь к файлу шаблона
              type: string
            source:
              title: Источник данных (документ, объект, запрос или dataset)
              anyOf:
                - type: string
                  title: Идентификатор dataset
                  pattern: "^[0-9a-zA-Z][a-zA-Z0-9\\_]*(\\.[a-zA-Z][a-zA-Z0-9\\_]*)*$"
                - type: string
                  title: JSONata запрос
                  pattern: "\\s*\\((.|\\s)*\\)\\s*"
                - title: Ссылка на документ
                  "$ref": "#/$defs/$res-uri-reference"
                - title: Объект
                  type: object
                - title: Массив
                  type: array
      additionalProperties: false
    presentations:
      blank:
        title: Представление документа
        params:
          title: Требуемые параметры для презентации
          type: object
          properties:
            "dh-doc-id":
              title: Идентификатор документа
              type: string
              pattern: ^[0-9a-zA-Z][a-zA-Z0-9_-]*(\.[a-zA-Z][a-zA-Z0-9_-]*)*$
          required:
            - dh-doc-id
        $constructor: >
          (
            $doc := $lookup(docs, $params."dh-doc-id");
            $merge([
              $doc,
              {
                "$base": "/docs/" & $params."dh-doc-id"
              }
            ])
          )
