rules:
  validators:
    seaf.validation.ta.p3.k8s_ha_node_count:
      uid: SEAF-TA-P3-K8S-HA-NODES
      title: '[TACSA_4-P9-46-04 (частично)] Минимальное число узлов на кластер (>=5)'
      description: "Частичная проверка отказоустойчивости (без разделения master/worker):\n\
        для каждого `seaf.company.ta.services.k8s` проверяется, что суммарное число `k8s_node`\n\
        с `cluster_ref` на этот кластер не меньше 5.\nТребование (частично): TACSA_4-P9-46-04\
        \ — Минимально допустимая конфигурация HA (целевое требование: ≥3 master и\
        \ ≥2 worker). Здесь проверяется только суммарное количество узлов.\n\nТребование\
        \ (цитата):\nКластер платформы контейнерной оркестрации должен состоять из\
        \ набора машин (узлов) и развёртывается на нескольких узлах.\n - мастер узлы\
        \ (master nodes) - минимум 3 узла\n - рабочие узлы (woker nodes) - минимум\
        \ 2 узла\n"
      correction: 'Добавьте узлы в кластер так, чтобы их общее количество было не
        ниже 5.

        '
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.p3.k8s_ha_node_count";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
          $cfg_root2 := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
          $company_ids := $keys($cfg_root2.company ? $cfg_root2.company : ($configs.company ? $configs.company : {}));
          $has_company_filter := $count($company_ids) > 0;
          $is_local := function($obj, $key){
            $has_company_filter
              ? (
                  ($exists($obj.__company_id__) and $obj.__company_id__ in $company_ids)
                  or ($substringBefore($key, ".") in $company_ids)
                )
              : (
                  $not($exists($obj.source)) or $obj.source = "seaf2"
                )
          };
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $req := "Кластер платформы контейнерной оркестрации должен состоять из набора машин (узлов) и развёртывается на нескольких узлах.
               - мастер узлы (master nodes) - минимум 3 узла
               - рабочие узлы (worker nodes) - минимум 2 узла";
                  $code := "TACSA_4-P9-46-04";
                  $nd_ds := $.datasets."seaf.company.ds.ta.k8s_nodes";
                  $nodes_map := $eval($nd_ds.source, { "objects": $, "data_lake": $ });
                  $nodes_list := $map($keys($nodes_map), function($nk){
                    $merge([$lookup($nodes_map, $nk), {"key": $nk}])
                  });
                  $k8s_ds := $.datasets."seaf.company.ds.ta.k8s";
                  $k8s_map := $eval($k8s_ds.source, { "objects": $, "data_lake": $ });

                  $each($k8s_map, function($k, $k_key){
                    (
                      $not($is_local($k, $k_key)) ? [] :
                      ($exists($k.is_own) and $k.is_own = false) ? [] :
                      $nodes := $filter($nodes_list, function($n){ $n.cluster_ref = $k_key });
                      $cnt := $count($nodes);
                      ($cnt = 0) ? [] : ($cnt < 5) ? {
                        "uid": "seaf.validation.ta.p3.k8s_ha_node_count.too_few." & $k_key,
                        "deviation_id": $code & ":" & "seaf.validation.ta.p3.k8s_ha_node_count.too_few." & $k_key,
                        "title": "Кластер '" & $k.title & "' содержит недостаточно узлов",
                        "correction": "ID: " & $k_key & ". " & ("Обеспечьте суммарно не менее 5 узлов"),
                        "description": "Найдено узлов: " & $string($cnt) & ". Проверка частичная: без ролей master/worker

              Требование (цитата):
              " & $req
                      } : []
                    )
                  }) ~> $reduce(function($curr, $acc){
                    (
                      $seq :=
                        ($type($curr) = "array") ? $curr :
                        ($type($curr) = "object") ? [$curr] :
                        [];
                      $seq ~> $reduce(function($value, $inner){
                        $inner ~> $append($value)
                      }, $acc)
                    )
                  }, [])
                )
              ])

            )
            : []
        )
