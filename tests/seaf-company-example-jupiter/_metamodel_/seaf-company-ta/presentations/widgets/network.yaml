            $mon_nodes := $collect(monitoring.*, "Monitoring", "mon");
            $kb_nodes := $collect(kb.*, "Security", "kb");
            $nodes := ($storage_nodes.node ~> $join("")) & ($hw_storage_nodes.node ~> $join("")) & ($backup_nodes.node ~> $join("")) & ($mon_nodes.node ~> $join("")) & ($kb_nodes.node ~> $join(""));
            $edges := ($storage_nodes.edge ~> $join("")) & ($hw_storage_nodes.edge ~> $join("")) & ($backup_nodes.edge ~> $join("")) & ($mon_nodes.edge ~> $join("")) & ($kb_nodes.edge ~> $join(""));
            $diagram :=
              $has_net
                ? $base & $net_node & $nodes & $edges & "@enduml"
                : "@startuml\nnote \"Сеть не найдена\" as no_network\n@enduml";
            { "diagram": $diagram }
          )

      network_client_devices:
