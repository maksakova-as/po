# Назначение: Промежуточный кеш ядра reverse-данных для снижения повторных вычислений в downstream датасетах.
# Используется: внутренний этап конвейера TA-датасетов.
datasets:
  seaf.company.ds.ta._cache.reverse_core:
    description: |
      Кэш ключевых reverse-датасетов (core/platform identity) для переиспользования в TA датасетах.
    origin:
      data_lake: ($)
      cfg: seaf.company.ds.ta._config
    source: >
      (
        $sources_enabled := cfg.enabled;
        "reverse" in $sources_enabled
          ? (
              $datasets := data_lake.datasets;
              $ctx := $merge([
                data_lake,
                {
                  "data_lake": data_lake,
                  "datasets": $datasets
                }
              ]);
              {
                "servers_cloud": $eval($datasets."reverse2seaf2.ds.ta.reverse.servers".source, $ctx),
                "servers_vmware": $eval($datasets."reverse2seaf2.ds.ta.reverse.vmware.servers".source, $ctx),
                "dcs_cloud": $eval($datasets."reverse2seaf2.ds.ta.reverse.dcs".source, $ctx),
                "dcs_vmware": $eval($datasets."reverse2seaf2.ds.ta.reverse.vmware.dcs".source, $ctx)
              }
            )
          : {}
      )
