        direction: Выход
        description: Результирующие данные работы сервиса

    performance: 10 TPS
    rpo: 8
    rto: 24
    sla: 99%
    integration_technologies:
      - HTTPS
      - Kafka protocol
    specs:
      - confl.jupiter.ru/spec-3342
      - confl.jupiter.ru/spec-4456
    comments:
      - Комментарий 1 о сервисе публикации новостей
      - Комментарий 2 о сервисе публикации новостей
      - Комментарий 3 о сервисе публикации новостей

