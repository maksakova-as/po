entities:
  seaf.company.artefacts:

    presentations:
      list:
        title: Список
        type: table

        headers:
          - value: id
            text: Идентификатор
            link: link
          - value: title
            text: Название
            align: left
            link: link
          - value: type
            text: Тип
            align: left
          - value: status
            text: Статус
            align: left
          - value: version
            text: Версия
            align: left
          - value: description
            text: Описание
            align: left

        origin: seaf.company.ds.artefacts
        source: >
          (
          $.*@$val.{
              "id": $val.__id__,
              "link": "/entities/" & $val.__entity_id__ & "/main?id=" & $val.__id__,
              "title": $val.title,
              "type": $val.type,
              "status": $val.status,
              "version": $val.version,
              "description": $val.description
          }[];
          )