datasets:
  seaf.company.ds.kadzo:
    # дополняем origin сводного датасета
    origin:
      kadzo.v2023.channels: seaf.company.ds.kadzo.channels

  seaf.company.ds.kadzo.channels:
    title: Каналы КАДЗО
    description: Датасет-трансформатор данных из формата SEAF в формат КАДЗО
    origin:
      obj_in: seaf.company.ds.ba.channels
      objects_links: seaf.ds.objects_links
      objects: seaf.ds.objects
      kadzo_status_enum:
        "Идея в проработке": Создается
        "Создается": Создается
        "Тестируется": Создается
        "Используется и развивается": Используется
        "Используется": Используется
        "В архиве": В архиве
        "Выведен из эксплуатации": Выводится
      kadzo_location_enum:
        "Внутренняя": Внутренний
        "Внешняя": Внешний

    # Принятые допущения:
    #    - Размещение берем из свойств первой системы realization.system

    source: >
      (
      $obj_in := obj_in;
      $objects_links := objects_links;
      $objects := objects;
      $kadzo_status_enum := kadzo_status_enum;
      $kadzo_location_enum := kadzo_location_enum;
      
      $obj_out := $each($obj_in, function ($val, $key) {(
          /* готовим данные */
          /* выявляем привязанные продуты */
          $linked_prods := [$lookup($objects_links, $key)[link_attr="distributed_via" and link_dir="reverse"].linked_id];
          $systems_arr := [$val.realization.system];
          /* формируем объект КАДЗО */
          { $key: {
              "title": $val.title,
              "description": $val.description,
              "comments": $val.comments,
              "type": $val.type,
              "products": $linked_prods != [] ? $linked_prods, 
              "clients": $val.serves_clients,
              "systems": $systems_arr != [] ? $systems_arr,
              "location": (
                $attr_val := $objects.$lookup($systems_arr[0]).location;
                $exists($attr_val) and $attr_val != null ? $seaf_company_fn_kadzo_convert_enum($kadzo_location_enum, $attr_val, [$key, "атрибут location", $attr_val]);
              ),
              /*  "security": ??? TODO Способы защиты канала */
              "status": (
                $attr_val := $val.lifecycle_stage;
                $exists($attr_val) and $attr_val != null ? $seaf_company_fn_kadzo_convert_enum($kadzo_status_enum, $attr_val, [$key, "атрибут lifecycle_stage", $attr_val])
              )
          }}
      )})[] ~> $merge();
      $obj_out
      )
