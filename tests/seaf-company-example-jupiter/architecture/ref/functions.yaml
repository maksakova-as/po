    is_part_of: jupiter.function.cybersec

  jupiter.function.esign:
    title: ЭЦП
    is_part_of: jupiter.function.cybersec

#  ИТ функциональность
  jupiter.function.it:
    title: ИТ функциональность
    description: >
      Функциональность для применения в области ИТ

  jupiter.function.integration_management:
