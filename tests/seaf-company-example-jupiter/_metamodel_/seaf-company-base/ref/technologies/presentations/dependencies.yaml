entities:
  seaf.company.technologies:

    presentations:
      # Встраиваемся в презентацию карточки
      card:
        widgets:
          dependencies:
            title: Зависит от технологий
            # Идентификатор презентации, которая будет использоваться в виджете
            presentation: dependencies
            # Расположение
            align: ">"
            # Порядок расположения
            order: 310
            # Определяем стиль виджета
            style:
              margin: 4px
              padding: 0px
              border: true

      # Презентация для виджета
      dependencies:
        params:
          type: object
          properties:
            id:
              title: ID
              type: string
          required:
            - id

        type: table
        headers:
          - value: number
            text: №
          - value: obj_id
            text: Идентификатор
            link: path_to_object
          - value: obj_title
            text: Название
            link: path_to_object

        origin:
          objects: seaf.company.ds.technologies
          all_objects: seaf.ds.objects
        source: >
          (
          $objects := objects;
          $all_objects := all_objects;
          $id := $params.id;
          $obj2present := $objects.$lookup($id);
          $data2present := $obj2present.dependencies;
          $exists($data2present) and  $data2present != null
          ? $map($data2present, function($val, $i) {(
              $o := $all_objects.$lookup($val);
              {
                "number": $i+1,
                "obj_id": $o.__id__,
                "obj_title": $o.title,
                "path_to_object": $o.__link_to_card__
              }
            )})[];
          )