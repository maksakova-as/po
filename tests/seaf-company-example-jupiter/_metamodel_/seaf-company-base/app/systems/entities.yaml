entities:
  seaf.company.app.systems:
    title: &entity_title Прикладные системы
    description: &entity_description |
      Автоматизированная система (АС) - самостоятельный объект управления в ИТ-процессах,
      представляющий собой набор разработанных или заимствованных компонентов программного обеспечения,
      реализующих логически связанный набор функциональности для выполнения необходимых бизнес-задач, 
      а также для поддержки других АС.
      Прикладная АС реализуюет функциональность для задач бизнеса или обеспечивающих подразделений.
      \n Используйте ключ (идентификатор) объекта вида: 
      \n - <компания>.app_system.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    objects:
      system:
        route: "/"
        title: Система
        symbol: system

    schema:
      $defs:
        seaf.company.def.app.system_classes_enum:
          enum:
            - BPM (Business Process Management)
            - CMS (Content Management System)
            - CRM-аналитический
            - CRM-операционный
            - ECM (Документооборот)
            - LLM-приложение
            - MDM (Master Data Management)
            - RPA (Robotic process automation)
            - Workforce Management
            - Аналитика данных
            - Бизнес-планирование
            - Биллинг
            - Бухгалтерия и финансы
            - Бюджетирование и контроль
            - Взаимоотношения с поставщиками
            - Гео-информационные системы
            - ИИ-агент
            - Иное
            - Каналы обслуживания клиентов (фронтальные решения)
            - Клиентский профиль (Customer Information File)
            - Корпоративная база знаний
            - Корпоративная отчетность
            - Корпоративный портал
            - Маркетинг
            - Маркетплейс компании
            - Мультиагентная система
            - Нормативная документация
            - Обмен данными с контрагентами
            - Получение сведений о юрлицах
            - Продуктовая фабрика (основная деятельность)
            - Продуктовый каталог
            - Регуляторная отчетность
            - Сайт компании
            - Системы генерации документов
            - Системы принятия решений
            - Скоринг и рейтинг клиентов
            - Совместная работа (collaboration)
            - Средства (инструменты) управления разработкой и хранения кода
            - Средства управления и автоматизации
            - Управление активами
            - Управление внутрихозяйственной деятельностью
            - Управление задачами и проектами
            - Управление обучением
            - Управление персоналом
            - Учет судебных дел
            - Финансовый мониторинг и AML
            - Средства коммуникации
            # Классы технических\инфраструктурных систем:
            - Системы резервного/архивного копирования
            - Системы логирования
            - Средства мониторинга
            - Инфраструктура удаленного доступа
            - Средства управления ИТ-службой, ИТ-инфраструктурой и ИТ-активами
            - Сервера/кластеры серверов приложений
            - Шлюзы, Балансировщики, Proxy
            - Файловый ресурс
            - Интеграционная шина
            - Системы управления большими данными и аналитической обработки больших объёмов данных
            - СУБД
            - Кэш, распределенный кеш

        seaf.company.def.app.system_attributes:
          properties:
            is_part_of:
              title: Является частью
              description: Родительская система для данной функциональной подсистемы
              $ref: "#/$rels/seaf.company.app.systems.system"

            class:
              title: Класс
              description: |
                Класс, определяющий основное предназначение системы \ функциональной подсистемы
              $ref: "#/$defs/seaf.company.def.app.system_classes_enum"

          required:
            - class

      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          allOf:
          #  конструируем сущность из компонентов схемы
            - $ref: "#/$defs/seaf.company.def.system"
            - $ref: "#/$defs/seaf.company.def.system_criticality_level"
            - $ref: "#/$defs/seaf.company.def.system_sla_parameters"
            - $ref: "#/$defs/seaf.company.def.tech_params.scalability"
            - $ref: "#/$defs/seaf.company.def.tech_params.monitoring"
            - $ref: "#/$defs/seaf.company.def.tech_params.ha"
            - $ref: "#/$defs/seaf.company.def.tech_params.dr"
            - $ref: "#/$defs/seaf.company.def.tech_params.backup"
            - $ref: "#/$defs/seaf.company.def.app.system_attributes"
            - $ref: "#/$defs/seaf.def.stakeholders"
