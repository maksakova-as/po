# Сводка по архитектурному аспекту
entities:
  seaf.company.da.physical_tables:
    presentations:
      # Встраиваемся в презентацию карточки
      attr_card:
        widgets:
          attr_summary:
            title: Сводка
            # Идентификатор презентации, которая будет использоваться в виджете
            presentation: attr_summary
            # Расположение
            align: "<"
            # Порядок расположения
            order: 10
            # Определяем стиль виджета
            style:
              margin: 4px
              padding: 0px
              border: true

      # Презентация для виджета
      attr_summary:
        params:
          type: object
          properties:
            id:
              title: Идентификатор объекта
              type: string
            attr_id:
              title: ID атрибута
              type: string
          required:
            - id
            - attr_id
        type: markdown
        template: ../../../_shared/templates/summary.md
        origin:
          objects: seaf.company.ds.da.physical_tables
          all_objects: seaf.ds.objects
        source: >
          (
          $objects := objects;
          $all_objects := all_objects;
          $object_id := $params.id;
          $attr_id := $params.attr_id;
          $obj2present := $lookup($objects, $object_id);
          $attr2present := $obj2present.attributes.$lookup($attr_id);
          [
              { "field_name": "Идентификатор атрибута", "field_content": { "value": $attr_id} },
              { "field_name": "Идентификатор атрибута во внешней системе", "field_content": { "value": $attr2present.external_id } },
              { "field_name": "Название", "field_content": { "value":$attr2present.title } },
              { "field_name": "Описание", "field_content": { "value": $attr2present.description } },
              { "field_name": "Наличие перс. данных", "field_content": { "value": $attr2present.pdn_flag ? "ДА" : "НЕТ"} },
              { "field_name": "Наличие крит. данных", "field_content": { "value": $attr2present.cde_flag ? "ДА" : "НЕТ"} },
              { "field_name": "Этап ЖЦ объекта", "field_content": { "value": $attr2present.lifecycle_stage } }
          ];
          )

