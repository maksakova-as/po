entities:
  seaf.company.da.business_terms:

    presentations:
      list:
        title: Список
        type: table

        headers:
          - value: id
            text: Идентификатор
            link: link
          - value: title
            text: Название
            align: left
            link: link
          - value: description
            text: Описание
            align: left
          - value: lifecycle_stage
            text: Этап ЖЦ
            align: left
          - value: owner
            text: Владелец
            align: left

        origin: seaf.company.ds.da.business_terms
        source: >
          (
          $.*@$val.{
              "id": $val.__id__,
              "link": "/entities/" & $val.__entity_id__ & "/card?id=" & $val.__id__,
              "title": $val.title,
              "owner": $val.owner,
              "lifecycle_stage": $val.lifecycle_stage,
              "description": $val.description
          }[];
          )