entities:
  seaf.company.ba.products:
    title: &entity_title Продукты
    description: &entity_description |
      Товары, услуги компании, созданные или адаптированные для использования внешними или внутренними клиентами
      \n Используйте ключ (идентификатор) объекта вида: 
      \n <компания>.product.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false
      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object

          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.def.lifecycle_stage"

          properties:
            is_part_of:
              title: Является частью
              description: Используется для задания древовидной структуры объектов
              $ref: "#/$rels/seaf.company.ba.products.product"

            distributed_via:
              title: Распространяется через
              description: Каналы распространения продукта
              type: array
              items:
                $ref: "#/$rels/seaf.company.ba.channels.channel"

            target_clients:
              title: Целевые клиенты
              description: Клиенты, на которых нацелен продукт
              type: array
              items:
                $ref: "#/$rels/seaf.company.ba.clients.client"

    objects:
      product:
        route: "/"
        title: Продукт
        symbol: "prd"