rules:
  validators:
    seaf.validation.ta.components.k8s_deployment_ref_integrity:
      uid: SEAF-TA-K8S-REF-DEP
      title: Проверка корректности связи Deployment с Namespace и K8s
      description: |
        Проверяет, что у каждого seaf.company.ta.services.k8s_deployments поля namespace_ref и cluster_ref
        указывают на существующие объекты в seaf.company.ta.components.k8s_namespaces и seaf.company.ta.services.k8s соответственно.
      correction: |
        Убедитесь, что namespace_ref и cluster_ref ссылаются на существующие объекты
        в соответствующих сущностях (k8s_namespace и k8s), и при необходимости исправьте значения или создайте недостающие элементы.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.components.k8s_deployment_ref_integrity";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $ds := $.datasets."seaf.company.ds.ta.k8s_deployments";
                  $deployments := $eval($ds.source, { "objects": $, "data_lake": $ });
                  $ns_ds := $.datasets."seaf.company.ds.ta.k8s_namespaces";
                  $namespaces := $eval($ns_ds.source, { "objects": $, "data_lake": $ });
                  $k8s_ds := $.datasets."seaf.company.ds.ta.k8s";
                  $clusters := $eval($k8s_ds.source, { "objects": $, "data_lake": $ });
                  $defined_ns := $keys($namespaces);
                  $defined_k8s := $keys($clusters);

                  $each($deployments, function($d, $d_key){
                    (
                      $nsr := $d.namespace_ref;
                      $cr := $d.cluster_ref;
                      ($not($exists($nsr)) or $nsr = "") ? {
                        "uid": "seaf.validation.ta.k8s_deployment_ref_integrity.ns.empty." & $d_key,
                        "title": "Deployment '" & $d.title & "' не заполнен namespace_ref",
                        "correction": "ID: " & $d_key & ". " & ("Укажите существующий Namespace (ключ из seaf.company.ta.components.k8s_namespaces)"),
                        "description": "Deployment (" & $d_key & ") не содержит поля namespace_ref"
                      } : (
                        $not($nsr in $defined_ns) ? {
                          "uid": "seaf.validation.ta.k8s_deployment_ref_integrity.ns.notfound." & $d_key,
                          "title": "Deployment '" & $d.title & "' ссылается на отсутствующий Namespace",
                          "correction": "ID: " & $d_key & ". " & ("Исправьте namespace_ref на существующий ключ из seaf.company.ta.components.k8s_namespaces"),
                          "description": "namespace_ref='" & $nsr & "' не найден в seaf.company.ta.components.k8s_namespaces"
                        } : (
                          ($not($exists($cr)) or $cr = "") ? {
                            "uid": "seaf.validation.ta.k8s_deployment_ref_integrity.k8s.empty." & $d_key,
                            "title": "Deployment '" & $d.title & "' не заполнен cluster_ref",
                            "correction": "ID: " & $d_key & ". " & ("Укажите существующий кластер (ключ из seaf.company.ta.services.k8s)"),
                            "description": "Deployment (" & $d_key & ") не содержит поля cluster_ref"
                          } : (
                            $not($cr in $defined_k8s) ? {
                              "uid": "seaf.validation.ta.k8s_deployment_ref_integrity.k8s.notfound." & $d_key,
                              "title": "Deployment '" & $d.title & "' ссылается на отсутствующий кластер",
                              "correction": "ID: " & $d_key & ". " & ("Исправьте cluster_ref на существующий ключ из seaf.company.ta.services.k8s"),
                              "description": "cluster_ref='" & $cr & "' не найден в seaf.company.ta.services.k8s"
                            }
                          )
                        )
                      )
                    )
                  })
                )
              ])
            )
            : []
        )
