entities:
  seaf.company.ba.channels:
    title: &entity_title Каналы
    description: &entity_description |
      Канал - это цифровое (web, app) физическое (офис, торговый зал) или смешанное (phygital) пространство Компании, 
      в котором Клиент (внешний и/или внутренний) знакомится, приобретает и пользуется продуктами Компании
      \n Используйте ключ (идентификатор) объекта вида: 
      \n <компания>.channel.<id_объекта>
      \n где: 
      \n - <компания> - идентификатор компании
      \n - токен в середине = тип объекта. Рекомендуется указывать для удобства использования архитектурных данных
      \n - <id_объекта> - идентификатор объекта данного типа

    schema:
      title: *entity_title
      description: *entity_description
      type: object

      additionalProperties: false
      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.def.lifecycle_stage"

          properties:
            is_part_of:
              title: Является частью
              description: Используется для задания древовидной структуры объектов
              $ref: "#/$rels/seaf.company.ba.channels.channel"

            type:
              title: Тип канала
              enum:
                - Цифровой
                - Физический
                - Phygital

            serves_clients:
              title: Обслуживает клиентов
              description: Ссылки на клиентов, обслуживаемых в данном канале
              type: array
              items:
                $ref: "#/$rels/seaf.company.ba.clients.client"

            realization:
              title: Реализация
              description: Перечисление ИТ-систем, в которых реализуется функциональность канала
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  system:
                    title: Ссылка на систему
                    description: Ссылка на автоматизированную систему \ сервис, с помощью которых реализуется данный канал
                    anyOf:
                      - $ref: "#/$rels/seaf.company.app.systems.system"
                      - $ref: "#/$rels/seaf.company.cybersec.systems.system"
                  description:
                    title: Описание
                    description: Описание предназначения системы для данного канала
                    type: string
                required:
                  - system

          required:
            - type
            - serves_clients
    objects:
      channel:
        route: "/"
        title: Канал
        symbol: "ch"


