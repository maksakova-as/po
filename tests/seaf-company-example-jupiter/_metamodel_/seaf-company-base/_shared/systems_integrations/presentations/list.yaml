entities:
  seaf.company.systems.integrations:

    presentations:
      list:
        title: Список
        type: table

        headers:
          - value: id
            text: Идентификатор
            link: link
          - value: description
            text: Описание
            align: left
          - value: system1
            text: Система1
            link: system1_link
            align: left
          - value: system2
            text: Система2
            link: system2_link
            align: left
          - value: service
            text: Сервис
            link: service_link
          - value: data_flow
            text: Передаваемые данные
            align: left
          - value: lifecycle_stage
            text: Этап ЖЦ
            align: left

        origin:
          integrations: seaf.company.ds.systems.integrations
          objects: seaf.ds.objects
        source: >
          (
          $integrations := integrations;
          $objects := objects;
          
          $map($integrations.*, function($val, $i) {(
              $sys1 := $lookup($objects, $val.system1);
              $sys2 := $lookup($objects, $val.system2);
              $srv := $lookup($objects, $val.service);
              {
                  "id": $val.__id__,
                  "link": $val.__link_to_card__,
              /*    "title": $val.title,*/
                  "system1": $sys1.title,
                  "system1_link": $sys1.__link_to_card__,
                  "system2": $sys2.title,
                  "system2_link": $sys2.__link_to_card__,
                  "service": $srv.title,
                  "service_link": $srv.__link_to_card__,
                  "data_flow": $val.data_flow.(number &". "& data_object_title &" ("& data_direction &")") ~> $join(",\n"),
                  "lifecycle_stage": $val.lifecycle_stage,
                  "description": $val.description
              }
          )})[];
          )