entities:
  # Типы данных
  seaf.def.data_types:
    title: Типы данных
    schema:
      $defs:
        seaf.def.type.date:
          description: |
            Дата в одном из форматов:
            \n- 2025
            \n- 2025Q4
            \n- 2025.10.27
            \n- 2025.10.27 16:49:30
          anyOf:
            - pattern: "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"  # YYYY.MM.DD
            - pattern: "^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$"  # YYYY.MM.DD HH:MM:SS
            - pattern: "^[0-9]{4}Q[1-4]{1}$"  # YYYYQN
            - pattern: "^[0-9]{4}$"  # YYYY
          type: [string, integer]
