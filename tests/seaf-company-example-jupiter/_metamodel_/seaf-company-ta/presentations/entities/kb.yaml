entities:
  seaf.company.ta.services.kbs:
    presentations:
      list:
        title: Сервисы кибербезопасности
        type: table
        headers:
          - value: title
            text: Название
            link: link
          - value: technology
            text: Технология
          - value: tag
            text: Категория
          - value: status
            text: Статус
          - value: networks
            text: Сети
          - value: id
            text: ID
        origin:
          kb: seaf.company.ds.ta.kb
          networks: seaf.company.ds.ta.networks
        source: >
          (
            $kb := kb;
            $networks := networks;
            $resolve_network := function($id){ $lookup($networks, $id) };
            $kb.*@$svc.(
              $network_titles := $exists($svc.network_connection)
                ? $svc.network_connection[].($resolve_network($).title)
                : [];
              {
                "id": $svc.__id__,
                "link": "/entities/" & $svc.__entity_id__ & "/card?id=" & $svc.__id__,
                "title": $svc.title,
                "technology": $svc.technology,
                "tag": $svc.tag,
                "status": $svc.status,
                "networks": $network_titles ~> $join(", ")
              }
            )[];
          )

      card:
        title: Карточка сервиса кибербезопасности
        params:
          type: object
          properties:
            id: {type: string}
          required:
            - id
        type: mkr-grid
        widgets:
          header:
            align: "^"
            presentation: header
            order: 0
            style:
              margin: 0px
              padding: 0px
              border: false
          details:
            title: Атрибуты
            presentation: kb_details
            align: "v"
            order: 10
          links:
            title: Связанные объекты
            presentation: kb_links
            align: "v"
            order: 20
          location_tree:
            title: Локация / сети
            presentation: kb_network_location_tree
            align: "v"
            order: 25
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            $obj := $lookup(objects, $params.id);
            $exists($obj.__id__)
              ? $seaf_fn_combine_widgets($self, $obj.__entity_id__, $obj.__id__)
              : { "type": "rows", "items": [] };
          )

      kb_details:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: field
            text: Атрибут
          - value: value
            text: Значение
            link: link
        origin:
          kb: seaf.company.ds.ta.kb
          networks: seaf.company.ds.ta.networks
        source: >
          (
            $svc := $lookup(kb, $params.id);
            $networks := networks;
            $resolve_network := function($id){ $lookup($networks, $id) };
            $network_rows := $exists($svc.network_connection)
              ? $svc.network_connection[].(
                  $net := $resolve_network($);
                  {
                    "field": "Сеть",
                    "value": $net.title,
                    "link": $exists($net) ? "/entities/" & $net.__entity_id__ & "/card?id=" & $net.__id__ : null
                  }
                )
              : [];
            $exists($svc)
              ? [
                  {"field": "ID", "value": $svc.__id__},
                  {"field": "Название", "value": $svc.title},
                  {"field": "Описание", "value": $svc.description},
                  {"field": "Технология", "value": $svc.technology},
                  {"field": "Категория", "value": $svc.tag},
                  {"field": "Статус", "value": $svc.status},
                  {"field": "ПО", "value": $svc.software_name}
                ] ~> $append($network_rows)
              : []
          )

      kb_links:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: table
        headers:
          - value: title
            text: Название
            link: link
          - value: type
            text: Тип
        origin:
          links: seaf.company.ds.ta.kb_links
        source: >
          (
            links ~> $filter(function($v){ $v.kb = $params.id })
          )
      kb_network_location_tree:
        params:
          type: object
          properties:
            id: {type: string}
          required: [id]
        type: plantuml
        template: ../widgets/templates/server_location.puml
        origin:
          kb: seaf.company.ds.ta.kb
          networks: seaf.company.ds.ta.networks
          segments: seaf.company.ds.ta.network_segments
          dcs: seaf.company.ds.ta.dcs
          offices: seaf.company.ds.ta.dc_offices
        source: >
          (
            $objs := kb;
            $networks := networks;
            $segments := segments;
            $dcs := dcs;
            $offices := offices;
            $obj := $lookup($objs, $params.id);
            $has_obj := $exists($obj.__id__);
            $resolve_location := function($id){
              $lookup($dcs, $id) ? $lookup($dcs, $id) : $lookup($offices, $id)
            };
            $obj_node :=
              $has_obj
                ? "rectangle \"Сервис кибербезопасности: [[/entities/" & $obj.__entity_id__ & "/card?id=" & $obj.__id__ & " " & $obj.title & "]]\" as obj_" & $replace($obj.__id__,/[^A-Za-z0-9_]/,"_") & " #d1c4e9\n"
                : "";
            $net_ids := (
              ($exists($obj.network_connection) ? ($type($obj.network_connection) = "array" ? $obj.network_connection : [$obj.network_connection]) : [])
            );
            $net_nodes := 
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $exists($net.__id__)
                      ? "rectangle \"Сеть: [[/entities/" & $net.__entity_id__ & "/card?id=" & $net.__id__ & " " & $net.title & "]]\" as net_" & $replace($net.__id__,/[^A-Za-z0-9_]/,"_") & " #c8e6c9\n"
                      : ""
                  ) ~> $join("")
                : "";
            $seg_nodes := 
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
                    $seg_ids.(
                      $seg := $lookup($segments, $);
                      $exists($seg.__id__)
                        ? "node \"Сегмент: [[/entities/" & $seg.__entity_id__ & "/card?id=" & $seg.__id__ & " " & $seg.title & "]]\" as seg_" & $replace($seg.__id__,/[^A-Za-z0-9_]/,"_") & " #ffecb3\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $loc_nodes := 
              $has_obj and $exists($obj.location)
                ? $obj.location[].(
                    $loc := $resolve_location($);
                    $exists($loc.__id__)
                      ? "node \"Локация: [[/entities/" & $loc.__entity_id__ & "/card?id=" & $loc.__id__ & " " & $loc.title & "]]\" as loc_" & $replace($loc.__id__,/[^A-Za-z0-9_]/,"_") & " #bbdefb\n"
                      : ""
                  ) ~> $join("")
                : "";
            $edges := 
              (
                $has_obj and $exists($obj.location)
                  ? $obj.location[].(
                      $loc := $resolve_location($);
                      $exists($loc.__id__)
                        ? "loc_" & $replace($loc.__id__,/[^A-Za-z0-9_]/,"_") & " --> obj_" & $replace($obj.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  : ""
              ) &
              (
                $has_obj and $exists($net_ids[0])
                  ? $net_ids.(
                      $net := $lookup($networks, $);
                      $exists($net.__id__)
                        ? "obj_" & $replace($obj.__id__,/[^A-Za-z0-9_]/,"_") & " --> net_" & $replace($net.__id__,/[^A-Za-z0-9_]/,"_") & " : подключен к\n"
                        : ""
                    ) ~> $join("")
                  : ""
              );
            $edges_loc_net := 
              $has_obj and $exists($obj.location) and $exists($net_ids[0])
                ? $obj.location[].(
                    $loc := $resolve_location($);
                    $loc_id := $replace($loc.__id__,/[^A-Za-z0-9_]/,"_");
                    $net_ids.(
                      $net := $lookup($networks, $);
                      $exists($net.__id__)
                        ? "loc_" & $loc_id & " --> net_" & $replace($net.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $edges_net_seg := 
              $has_obj and $exists($net_ids[0])
                ? $net_ids.(
                    $net := $lookup($networks, $);
                    $net_id := $replace($net.__id__,/[^A-Za-z0-9_]/,"_");
                    $seg_ids := $exists($net.segment) ? ($type($net.segment) = "array" ? $net.segment : [$net.segment]) : [];
                    $seg_ids.(
                      $seg := $lookup($segments, $);
                      $exists($seg.__id__)
                        ? "net_" & $net_id & " --> seg_" & $replace($seg.__id__,/[^A-Za-z0-9_]/,"_") & "\n"
                        : ""
                    ) ~> $join("")
                  ) ~> $distinct() ~> $join("")
                : "";
            $diagram := 
              $has_obj
                ? (
                    "@startuml\n" &
                    "top to bottom direction\n" &
                    "skinparam nodesep 60\n" &
                    "skinparam ranksep 60\n" &
                    "skinparam backgroundColor #ffffff\n" &
                    "skinparam defaultTextAlignment center\n" &
                    "skinparam shadowing false\n" &
                    "skinparam rectangle {\n" &
                    "  BackgroundColor #f2f4f7\n" &
                    "  BorderColor #4d6bf0\n" &
                    "  FontColor #111318\n" &
                    "}\n" &
                    "skinparam node {\n" &
                    "  BackgroundColor #fdfdfd\n" &
                    "  BorderColor #4d6bf0\n" &
                    "  FontColor #111318\n" &
                    "}\n" &
                    "skinparam arrowColor #4d6bf0\n" &
                    "skinparam arrowFontColor #111318\n" &
                    $loc_nodes & $seg_nodes & $net_nodes & $obj_node & $edges_loc_net & $edges_net_seg & $edges &
                    "@enduml"
                  )
                : "@startuml\nnote \"Сервис кибербезопасности не найден\" as no_obj\n@enduml";
            { "diagram": $diagram }
          )

      header:
        type: markdown
        template: ../../../seaf-company-base/_shared/templates/header.md
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
          required:
            - id
        origin:
          objects: seaf.company.ds.ta.all_objects
        source: >
          (
            /*  ищем объект для презентации */
            $obj2present := $lookup(objects, $params.id);
            {
              "entity": $obj2present.__entity_title__,
              "title": $obj2present.title
            }
          )
