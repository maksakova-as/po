rules:
  validators:
    seaf.validation.ta.components.user_device_connection_check:
      uid: SEAF-TA-USER-DEV-CONN-001
      title: Проверка корректности связи Пользовательского устройства и сетей
      description: |
        Проверяет, что у каждого Пользовательского устройства (seaf.company.ta.components.user_devices)
        заполнено поле `network_connection`, и что все перечисленные сети существуют в `seaf.company.ta.services.networks`.
      correction: |
        Убедитесь, что для каждого объекта `seaf.company.ta.components.user_devices`
        заполнен непустой массив `network_connection`, а значения из него совпадают с ключами
        в `seaf.company.ta.services.networks`.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.components.user_device_connection_check";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $ds := $.datasets."seaf.company.ds.ta.user_devices";
                  $entities := $eval($ds.source, { "objects": $, "data_lake": $ });
                  $net_ds := $.datasets."seaf.company.ds.ta.networks";
                  $networks := $eval($net_ds.source, { "objects": $, "data_lake": $ });
                  $each($entities, function($entity, $entity_key) {
                    (
                        $connections := $entity.network_connection;
                        $not($exists($connections)) or $count($connections) = 0 ? {
                            "uid": "seaf.validation.ta.user_device_connection_check.missing." & $entity_key,
                            "title": "У пользовательского устройства '" & $entity.title & "' отсутствует список network_connection.",
                            "correction": "ID: " & $entity_key & ". " & ("Заполните поле `network_connection` хотя бы одним ID сети."),
                            "description": "Пользовательское устройство '" & $entity.title & "' (UID: " & $entity_key & ") не содержит списка network_connection."
                        } : (
                            $defined_network_keys := $keys($networks);
                            $invalid_connections := $filter($connections, function($c) { $not($c in $defined_network_keys) });
                            $count($invalid_connections) > 0 ? {
                                "uid": "seaf.validation.ta.user_device_connection_check.notfound." & $entity_key,
                                "title": "У пользовательского устройства '" & $entity.title & "' указаны неизвестные сети.",
                                "correction": "ID: " & $entity_key & ". " & ("Проверьте значения в `network_connection` устройства '" & $entity.title & "'. Каждое должно существовать в `seaf.company.ta.services.networks`."),
                                "description": "Пользовательское устройство '" & $entity.title & "' (UID: " & $entity_key & ") ссылается на отсутствующие сети: " & $join($invalid_connections, ", ")
                            }
                        )
                    )
                  })
                )
              ])
            )
            : []
        )
