entities:
  seaf.company.da.physical_tables:
    presentations:
      # Встраиваемся в презентацию карточки
      attr_card:
        # Добавляем собственный виджет
        widgets:
          attr_header:
            # Расположение вверху
            align: "^"
            # Идентификатор презентации, которая будет использоваться в виджете
            presentation: attr_header
            # Порядок расположения
            order: 0
            # Определяем стиль виджета
            style:
              margin: 0px
              padding: 0px
              border: false

      # Презентация для виджета
      attr_header:
        type: markdown
        template: templates/attr_header.md
        params:
          type: object
          properties:
            id:
              title: Идентификатор
              type: string
            attr_id:
              title: ID атрибута
              type: string
          required:
            - id
            - attr_id
        origin:
          objects: seaf.ds.objects
        source: >
          (
          /*  ищем объект для презентации */
          $obj2present := $lookup(objects, $params.id);
          $attr2present := $obj2present.attributes.$lookup($params.attr_id);
              { 
                  "title": $obj2present.title,
                  "entity": $obj2present.__entity_title__, 
                  "attr_title": $attr2present.title & " (" & $params.attr_id & ")"
              }
          )
          
