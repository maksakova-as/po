rules:
  validators:
    seaf.validation.ta.components.hw_storage_existence:
      uid: SEAF-TA-EXIST-HW-STORAGE
      title: Проверка наличия Аппаратной СХД (hw_storage)
      description: |
        Проверка, что в архитектуре задан хотя бы один объект hw_storage.
      correction: |
        Добавьте, пожалуйста, запись (`/architecture/ta/`) сайта
        либо в ручном режиме в `seaf.company.ta.components.hw_storages`.
      source: |
        (
          $configs := $."seaf.configs";
          $ta_config := (
            $cfg_root := $configs."seaf.configs" ? $configs."seaf.configs" : $configs;
            $cfg1 := $configs."seaf.company.ta";
            $cfg2 := $configs.seaf.company.ta;
            $cfg3 := $cfg_root."seaf.company.ta";
            $cfg4 := $cfg_root.seaf.company.ta;
            $cfg1 ? $cfg1 : ($cfg2 ? $cfg2 : ($cfg3 ? $cfg3 : $cfg4))
          );
          $rules_cfg := $ta_config.rules ? $ta_config.rules : {};
          $rules_enabled := $exists($rules_cfg.rules_enabled) ? $rules_cfg.rules_enabled : true;
          $rules_disabled := $exists($rules_cfg.rules_disabled) ? $rules_cfg.rules_disabled : [];
          $rule_id := "seaf.validation.ta.components.hw_storage_existence";
          $rule_uid := $self.uid;
          $rule_is_disabled := ($rule_id in $rules_disabled) or ($rule_uid in $rules_disabled);
        
          $rules_enabled and $not($rule_is_disabled)
            ? (
              ([
                (
                  $data := $."seaf.company.ta.components.hw_storages";
                  $count($data) = 0 ? {
                      "uid": "seaf.validation.ta.existence.hw_storage",
                      "title": "Отсутсвует описание Аппаратной СХД (hw_storage)",
                      "correction": "ID: " & "seaf.validation.ta.existence.hw_storage" & ". " & ("Обязательно укажите хотя бы один объект hw_storage (seaf.company.ta.components.hw_storages) в архитектуре."),
                      "description": "В архитектуре не найден ни один hw_storage."
                  }
                )
              ])
            )
            : []
        )
