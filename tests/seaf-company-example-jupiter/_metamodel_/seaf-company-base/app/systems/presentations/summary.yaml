# Сводка по архитектурному аспекту
entities:
  seaf.company.app.systems:
    presentations:
      # Встраиваемся в презентацию карточки
      card:
        widgets:
          summary:
            title: Сводка
            # Идентификатор презентации, которая будет использоваться в виджете
            presentation: summary
            # Расположение
            align: "<"
            # Порядок расположения
            order: 200
            # Определяем стиль виджета
            style:
              margin: 4px
              padding: 0px
              border: true

      # Презентация для виджета
      summary:
        params:
          type: object
          properties:
            id:
              title: Идентификатор объекта
              type: string
          required:
            - id
        type: markdown
        template: ../../../_shared/templates/summary.md

        origin:
          objects: seaf.company.ds.app.systems
        source: >
          (
          /*  ищем объект для презентации */
          $obj2present := $lookup(objects, $params.id);
          
          [
              { "field_name": "Идентификатор объекта", "field_content": { "value": $obj2present.__id__} },
              { "field_name": "Идентификатор объекта во внешней системе", "field_content": { "value": $obj2present.external_id } },
              { "field_name": "Идентификатор сущности", "field_content": { "value": $obj2present.__entity_id__ } },
              { "field_name": "Название", "field_content": { "value":$obj2present.title } },
              { "field_name": "Класс", "field_content": { "value":$obj2present.class } },
              { "field_name": "Описание", "field_content": { "value": $obj2present.description } },
              { "field_name": "Критичность", "field_content": { "value":$obj2present.criticality_level } },
              { "field_name": "Целевой статус", "field_content": { "value":$obj2present.target_status } },
              { "field_name": "Размещение", "field_content": { "value":$obj2present.location } },
              { "field_name": "Владение", "field_content": { "value":$obj2present.ownership } },
              { "field_name": "Идентификатор объекта во внешней ITSM системе", "field_content": { "value": $obj2present.external_itsm_id } },
              { "field_name": "Этап ЖЦ объекта", "field_content": { "value": $obj2present.lifecycle_stage } }
          ];
          )