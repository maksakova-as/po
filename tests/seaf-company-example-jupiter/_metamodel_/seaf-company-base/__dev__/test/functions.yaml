functions:
  seaf_fn_combine_widgets:
    title: Функция формирования комбинации виджетов
    params:
      - alias: presentation
        type: object
        title: Представление, кля которого строится разбивка на виджеты
        required: true
      - alias: entity_id
        type: string
        title: Идентификатор сущности, для которой будет вызываться презентация виджета
        minLength: 1
        required: true
      - alias: object_id
        type: string
        title: Идентификатор объекта, для которого будет вызываться презентация виджета
        minLength: 1
        required: true
    result:
      type: object
    code: >
      (      
          $presentation := presentation;
          $param_name := "id";
          $entity_id := entity_id;
          $object_id := object_id;
          
          /* Получаем виджеты, которые нужно отобразить */
          $widgets := $presentation.widgets;
          $wtop := $widgets.*[align="^"]^(order);
          $wleft := $widgets.*[align="<"]^(order);
          $wright := $widgets.*[align=">"]^(order);
          $bottom := $widgets.*[align="v" or $not(align=">" or align="<" or align="^")]^(order);
            
          /* Функция генерации  профиля виджета для секции разметки */
          $makeWidget := function($widgets) {(
              [$widgets.{
                  "title": title,
                  "icon": icon,
                  "style": style ? style : {},
                  "src": "@entity/" & $entity_id & "/" & presentation & "?" & $param_name & "=" & $object_id
              }];
          )};
          
          $rows := $append(
              /* Добавляем топовые виджеты */
              $makeWidget($wtop),
              /* Добавляем виджеты в середину*/
              [
                  {
                      "type": "columns",
                      "items": [
                          {
                              "type": "rows",
                              "width": "60%",
                              /* Строим список виджетов левой секции */
                              "items": $makeWidget($wleft)
                          },
                          {
                              "type": "rows",
                              "width": "40%",
                              /* Строим список виджетов правой секции */
                              "items": $makeWidget($wright)
                          }
                      ]
                  }
              ]
          );      
          /* Добавляем остальные виджеты внизу по центру */
          $rows := $append($rows, $makeWidget($bottom));      
            
          /* Строим разметку страницы */
          {
            "type": "rows",
            "items": $rows
          }
      )

  seaf_fn_get_root_menu:
    title: Поиск корневого меню для раздела
    params:
      - alias: configs
        type: object
        title: Объект-коллекция конфигов
        required: true
      - alias: domain_id
        type: string
        title: Идентификатор домена
        required: true
    result:
      type: string
    code: >
      (      
          $domain_id := domain_id;
          $default_root_menu := $domain_id;
          $rm := configs.$lookup($domain_id).root_menu;
          $exists($rm) ? $rm : $default_root_menu;
      )

  seaf_fn_generate_menu_item:
    title: Генерация пункта меню
    params:
      - alias: menu_in
        type: string
        title: Строка меню для обработки
        required: true
      - alias: root_menu
        type: string
        title: Корневое меню
        required: true
    result:
      type: string
    code: >
      (      
          $menu_in := menu_in;
          $root_menu := root_menu;
          $absolute_menu_found := $match($menu_in, /^(\/)(.*)$/)[0].groups;
          $absolute_menu_found != []
              ? /* был задан абсолютный путь меню для объекта (нач. с /) */ 
                  $absolute_menu_found[1] /* берем путь меню без первого слэша */
              : /* был задан отн. путь меню - добавляем корн. путь */
                  $menu_in != "" 
                  ? $root_menu != "" ? $root_menu & "/" & $menu_in : $menu_in
                  : $root_menu != "" ? $root_menu : "задайте_меню!"
      )
