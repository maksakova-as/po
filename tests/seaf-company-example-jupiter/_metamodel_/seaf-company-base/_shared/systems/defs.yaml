entities:
  seaf.company.def.systems:
    schema:
      # Основные определения атрибутов систем
      $defs:
        seaf.company.def.system_criticality_level:
          properties:
            criticality_level:
              title: Уровень критичности
              description: |
                Рассчитанный уровень критичности автоматизированной системы / функциональной подсистемы.
                Расчет должен быть произведен в соответствии с правилами и методикой, определенными в артефакте "Паспорт оценки критичности АС".
              enum:
                - Mission Critical Plus
                - Mission Critical
                - Business Critical
                - Business Operational
                - Office Productivity
          required:
            - criticality_level

        seaf.company.def.system_lifecycle_stage_enum:
          enum:
            - Эскиз
            - В разработке / приобретение
            - Внедрение / Не введена в эксплуатацию
            - Опытная эксплуатация
            - Промышленная эксплуатация
            - Архивная
            - Отменена

        seaf.company.def.system_lifecycle_stage:
          # Общий справочник ЖЦ системы\интеграции
          properties:
            lifecycle_stage:
              title: Этап жизненного цикла
              description: Текущий этап жизненного цикла автоматизированной системы/функциональной подсистемы
              $ref: "#/$defs/seaf.company.def.system_lifecycle_stage_enum"

        seaf.company.def.system_integrations:
          # Описание интеграций для всех видов систем
          properties:
            integrations:
              title: Интеграции
              type: object
              description: |
                Интеграционные потоки данной системы. Каждый поток описывается отдельным объектом.
                Ключ (идентификтор) объекта - любая последовательность строчных лат. букв, цифр, _
              additionalProperties: false
              patternProperties:
                "^([a-z0-9_]+)$":
                  title: "ИП_id"  # это название используется как имя атрибута в ER диаграмме
                  description: |
                    Интеграционный поток
                  type: object

                  # additionalProperties: false
                  # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                  # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                  allOf:
                    - $ref: "#/$defs/seaf.company.def.system_lifecycle_stage"

                  properties:
                    title:
                      title: Название потокоа
                      type: string
                      description: Используется в качестве названия объекта в схемах и отчетах

                    description:
                      title: Описание потока
                      type: string
                      description: Описание интеграционного потока

                    service:
                      title: Сервис
                      description: Сервис, потребляемый нашей системой в рамках данного интеграционного потока
                      $ref: "#/$rels/seaf.company.services.service"

                    protection_methods:
                      title: Средства защиты
                      description: |
                        Используется для указания технологий защиты передачи данных. Например:
                          - шифрование с указанием способа (mTLS 1.2, ГОСТ, RSA, DSS)
                          - обеспечение целостности (HMAC, электронная подпись, простое хеширование)
                          - защита отсутствует
                      type: array
                      items:
                        type: string

                    data_exchange_grounds:
                      title: Основание для обмена данными
                      type: string
                      description: |
                        Используется для указания документа на основании которого производится обмен данными.
                        Для внешних интеграций необходимо указать договор-основание для передачи/получения данных.
                        Для внутренних интеграций необходимо указать ссылку на ВнД (регламенты, архитектурные артефакты, SLA)

                    comments:
                      title: Комментарии к интеграции
                      type: array
                      items:
                        type: string

                  required:
                    - title
                    - service

        # атрибуты SLA системы
        seaf.company.def.system_sla_parameters:
          properties:
            performance:
              title: Производительность
              description: |
                Параметры производительности системы / сервиса.
                В зависимости от реализуемой функциональности, производительность может содержать информацию о количестве запросов, времени обработки одного запроса, 
                времени чтения, записи, вставки и удаления объектов данных в системе или иные показатели, характеризующие производительность.
                В общепринятой практике, параметры производительности системы подтверждаются нагрузочным тестированием.
                Для внешних систем / сервисов, обычно, производительность фиксируется Договоре об уровне сервиса (SLA).
              type: [string, number]

            rto:
              title: RTO (час)
              description: |
                RTO (recovery time objective) - максимальный период времени (в часах),
                за который могут быть потеряны данные в результате сбоя / выхода из строя автоматизированной системы / функциональной подсистемы / сервиса.
              type: [string, number]

            rpo:
              title: RPO (час)
              description: |
                RPO (recovery point objective) - период времени (выраженного в часах), в течение которого система гарантированно должна быть 
                восстановлена после сбоя / выхода из строя
              type: [string, number]

            sla:
              title: Уровень доступности SLA (%)
              description: |
                Уровень доступности, которому должна удовлетворять автоматизированная система / функциональная подсистема / сервис.
                Уровень доступности рассчитывается как отношение времени, когда система должна полностью функционировать в рамках определенного временного периода 
                к длительности этого временного периода. 
                Обычно в качестве периода принимается 1 год.
                Уровень доступности выражается в процентах.
              type: [string, number]

        # блок атрибутов для описания тех. параметров функционирования системы
        seaf.company.def.tech_params.monitoring:
          properties:
            monitoring:
              title: Средства мониторинга
              description: |
                Средства мониторинга, применяемые для данного объекта
              type: array
              items:
                type: string

        seaf.company.def.tech_params.ha:
          properties:
            high_availability:
              title: Параметры отказоустойчивости
              description: |
                Отказоустойчивость - это способность объекта сохранять работоспособность в случае отказа одного или нескольких (различных) его компонентов в пределах одной зоны доступности
              type: object
              additionalProperties: false
              properties:
                type:
                  title: Высокая доступность объекта (HA)
                  description: |
                    Свойство объекта, обозначающее его способность (реализованную) сохранять работоспособность в случае отказа одного или нескольких (различных) его компонентов
                    в пределах одной зоны доступности.
                    В качестве значений должны использоваться значения соответствующего справочника.
                    \n- "Да" для объекта, построенного на принципах НА
                    \n- "Нет" для объекта, не реализующего НА
                  enum:
                    - Да
                    - Нет
                capacity_reservation_type:
                  title: | 
                    Тип резервирования
                    в пределах одной зоны доступности
                  description: |
                    Тип резервирования мощностей в пределах одной зоны доступности.
                    В качестве значений должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - StandBy
                    - Active
                capacity_management:
                  title: |
                    Полнота резервирования 
                    в пределах одной зоны доступности
                  description: |
                    Степень полноты резервирования мощностей и данных в пределах одной зоны доступности.
                    В качестве значений должны использоваться значения соответствующего справочника:
                    \n - "Отсутствует" если резервирование не реализовано ни для одного из компонентов объекта
                    \n - "Частичное" если:
                    \n             * резервирование реализовано не для всех компонентов объекта,
                    \n             * либо для некоторых компонентов вычислительные мощности зарезервированы не в полном объеме,
                    \n             * либо для statefull компонентов данные зарезервированы не в полном объеме
                    \n - "Полное" если вычислительные мощности зарезервированы в полном объеме для всех компонентов, и для statefull компонентов данные зарезервированы в полном объеме
                  enum:
                    - Отсутствует
                    - Частичное
                    - Полное
              required:
                - type
                - capacity_reservation_type
                - capacity_management

        seaf.company.def.tech_params.dr:
          properties:
            disaster_recovery:
              title: Катастрофоустойчивость
              description: |
                Катастрофоустойчивость - это способность объекта сохранять работоспособность в случае недоступности одной из площадок (ЦОД),
                в которой размещен объект (или его компоненты).

              type: object
              additionalProperties: false
              properties:
                type:
                  title: Катастрофоустойчивость объекта (DR)
                  description: |
                    Свойство объекта, обозначающее его способность (реализованную) сохранять работоспособность в случае недоступности одной из площадок (ЦОД), 
                    в которой размещен объект (или его компоненты).
                    В качестве значений должны использоваться значения соответствующего справочника:
                    \n- "Да" если объект зарезервирован в различных зонах доступности
                    \n- "Нет" если объект не зарезервирован в различных зонах доступности
                  enum:
                    - Да
                    - Нет
                capacity_reservation_type:
                  title: |
                    Тип резервирования 
                    в резервных зонах доступности
                  description: |
                    Тип резервирования мощностей в нескольких (различных) зонах доступности
                    В качестве значений данной аналитики должны использоваться значения соответствующего справочника
                  enum:
                    - Отсутствует
                    - StandBy
                    - Active
                capacity_management:
                  title: |
                    Полнота резервирования 
                    в резервных зонах доступности
                  description: |
                    Степень полноты резервирования мощностей и данных в резервных зонах доступности.
                    В качестве значений данной аналитики должны использоваться значения справочника:
                    \n - "Отсутствует" если резервирование не реализовано ни для одного из компонентов объекта
                    \n - "Частичное" если:
                    \n             * резервирование реализовано не для всех компонентов объекта,
                    \n             * либо для некоторых компонентов вычислительные мощности зарезервированы не в полном объеме,
                    \n             * либо для statefull компонентов данные зарезервированы не в полном объеме
                    \n - "Полное" если вычислительные мощности зарезервированы в полном объеме для всех компонентов, и для statefull компонентов данные зарезервированы в полном объеме
                  enum:
                    - Отсутствует
                    - Частичное
                    - Полное
              required:
                - type
                - capacity_reservation_type
                - capacity_management

        seaf.company.def.tech_params.scalability:
          properties:
            scalability:
              title: Масштабируемость
              description: |
                Способ (стратегия) обеспечения масштабируемости объекта
              enum:
                - Нет
                - Вертикальная
                - Горизонтальная
                - Вертикальная и горизонтальная

        seaf.company.def.tech_params.backup:
          properties:
            backup:
              type: object
              additionalProperties: false
              title: Бекапирование
              description: |
                Параметры бэкапирования для данного объекта
              properties:
                placement:
                  title: |
                    Резервное копирование
                    (место хранение бекапа)
                  description: |
                    Место хранения резервной копии данных объекта.
                    В качестве значений данной аналитики должны использоваться значения справочника
                  enum:
                    - Отсутствует
                    - ЦОД
                    - Резервный ЦОД
                    - Offsite
                backup_placement:
                  title: |
                    Резервное копирование дубликата 
                    (место хранения дубликата резервной копии)
                  description: |
                    Место хранения дубликата (второго экземпляра) резервной копии объекта.
                    В качестве значений данной аналитики должны использоваться значения соответствующего справочника.
                  enum:
                    - Отсутствует
                    - ЦОД
                    - Резервный ЦОД
                    - Offsite
              required:
                - placement
                - backup_placement

        seaf.company.def.uses_technologies:
          properties:
            uses_technologies:
              title: Использует технологии
              description: |
                Какие технологии применены для построения системы \ компонента. 
                Например, какое программное обеспечение используется в рамках системы \ компонента.
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  technology:
                    title: Технология
                    description: Ссылка на используемую технологию
                    $ref: "#/$rels/seaf.company.technologies.technology"

                  description:
                    title: Описание
                    description: Описание использования технологии
                    type: string

        # Общие атрибуты для всех видов систем
        seaf.company.def.system:
          type: object
          # additionalProperties: false
          # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
          # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
          allOf:
            - $ref: "#/$defs/seaf.def.basic_attributes"
            - $ref: "#/$defs/seaf.company.def.system_lifecycle_stage"
            - $ref: "#/$defs/seaf.company.def.system_integrations"
            - $ref: "#/$defs/seaf.company.def.uses_technologies"

          properties:

            realizes_functions:
              title: Реализует функции
              description: Функциональность, реализуемая данной системой
              type: array
              minItems: 1
              items:
                type: object
                # additionalProperties: false
                # TODO: заменить на unevaluatedProperties: false после реализации в движках idea, vscode
                # ошибка валидации возникает при комбинации additionalProperties: false + allOf на одном уровне
                allOf:
                  - $ref: "#/$defs/seaf.company.def.system_lifecycle_stage"

                properties:
                  function:
                    title: Функция
                    description: Ссылка на реализуемую функцию из справочника функциональности
                    $ref: "#/$rels/seaf.company.functions.function"

                  service:
                    title: Сервис
                    description: Ссылка на сервис, в составе которого опубликована указаная функция
                    $ref: "#/$rels/seaf.company.services.service"

                  description:
                    title: Описание
                    description: Описание реализации функции
                    type: string

                  target_status:
                    title: Целевой статус функции
                    description: Статус функции в рамках данной автоматизированной системы/функциональной подсистемы
                    enum:
                      - Целевая
                      - Нецелевая

                required:
                  - function

            target_status:
              title: Целевой статус
              description: Утвержденный статус автоматизированной системы/функциональной подсистемы
              enum:
                - Целевая
                - Нецелевая

            location:
              title: Размещение
              description: |
                Место нахождения автоматизированной системы по отношению к периметру ИТ-ландшафта Компании.
                Системы, находящиеся вне периметра ИТ-ландшафта Компании, считаются внешними, соответственно, системы,
                находящиеся внутри периметра Компании - считаются внутренними.
              enum:
                - Внутренняя
                - Внешняя

            ownership:
              title: Степень владения
              description: Правовой аспект использования системы компанией
              enum:
                - Владеем исходным кодом
                - Владеем экземпляром
                - SaaS
                - Система партнера

            external_itsm_id:
              title: ID во внешнем ITSM
              description: Идентификатор IHCI в центральном ITSM группы компаний \ экосистемы \ холдинга, куда входит наша компания
              type: [string, number]

            categories:
              title: Категории
              description: |
                Разметка данного объекта категориями из справочника категорий
              type: array
              items:
                $ref: "#/$rels/seaf.company.categories.category"
