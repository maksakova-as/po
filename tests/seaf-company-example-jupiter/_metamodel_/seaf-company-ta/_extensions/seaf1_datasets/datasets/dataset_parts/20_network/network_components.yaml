# Назначение: Подготовка датасета `seaf.company.ds.ta.network_components` (network components) в контуре seaf1_datasets.
# Используется: compat-слой seaf1 -> seaf2 (подключается по необходимости через extension root).
# SEAF1 counterpart of seaf.company.ds.ta.network_components
datasets:
  seaf.company.ds.ta.network_components:
    description: |
      Сетевые устройства
    origin:
      by_entities: seaf.ds.objects_by_entities
      data_lake: ($)
    source: >
      (
        $seaf2 := $exists(by_entities."seaf.company.ta.components.networks") ? by_entities."seaf.company.ta.components.networks" : {};
        $list := data_lake."seaf.ta.components.network";
        $seaf1 := $exists($list)
          ? $each($list, function($val, $key) {
              {
                $key: $merge([
                  $val,
                  {
                    "__id__": $key,
                    "__entity_id__": "seaf.company.ta.components.networks",
                    "__entity_id": $key,
                    "__object_type": "seaf.company.ta.components.networks"
                  }
                ])
              }
            }) ~> $merge()
          : {};
        $merge([$seaf2, $seaf1])
      )
