entities:
  seaf.toolkit.mm_viewer.obj_diagrams:
    title: Диаграммы объектов модели
    menu: >
      (
          [$."seaf.toolkit.mm_viewer.obj_diagrams".$spread()[*.location].(
              {
                  "link": "/entities/seaf.toolkit.mm_viewer.obj_diagrams/view?id=" & $keys()[0], 
                  "location": *.location,
                  "order": *.order
              }
         )]
      )
    schema:
      type: object
      patternProperties:
        "^[a-zA-Z][a-zA-Z0-9_-]*(\\.[a-zA-Z][a-zA-Z0-9_-]*)*$":
          additionalProperties: false
          type: object
          properties:
            title:
              title: Название
              type: string

            location:
              title: Пункт меню
              type: string

            grouping:
              title: Группировка объектов на карте
              description: >
                Если true, то объекты на карте будут группироваться в контейнеры. 
                Имена контейнеров задаются атрибутом group в секциях entity_patterns_formats и object_patterns_formats
              type: boolean


            entity_patterns:
              title: Паттерны для фильтрации по имени сущностей метамодели
              description: Задается массив паттернов имен сущностей, экземпляры которых (объекты) будут отображены на схеме. Не попавшие в паттерны сущности отбрасываются
              type: array
              items:
                title: Паттерн имени сущности
                type: string

            entity_patterns_formats:
              title: Форматы цвета и стиля для сущностей
              description: Задается массив форматов для различных паттернов имен сущностей. Используется первое найденное сопадение с паттерном
              type: array
              items:
                title: Массив форматов
                type: object
                additionalProperties: false
                properties:
                  pattern:
                    title: Паттерн имени сущности
                    type: string
                  group:
                    title: Группа объекта
                    type: string
                  object_format:
                    title: plantuml формат цвета\стиля для объекта
                    type: string
                  link_format:
                    title: plantuml формат цвета\стиля для исходящей стрелки объекта
                    type: string
                required:
                  - pattern
                  - object_format

            object_patterns_formats:
              title: Форматы цвета и стиля для объектов
              description: Задается массив форматов для различных паттернов имен объектов. Используется первое найденное сопадение с паттерном. Иммеет приоритет над entity_pattern_formatting
              type: array
              items:
                title: Массив форматов
                type: object
                additionalProperties: false
                properties:
                  pattern:
                    title: Паттерн имени объекта
                    type: string
                  group:
                    title: Группа объекта
                    type: string
                  object_format:
                    title: plantuml формат цвета\стиля для объекта
                    type: string
                  link_format:
                    title: plantuml формат цвета\стиля для исходящей стрелки объекта
                    type: string
                required:
                  - pattern
                  - object_format


          required:
            - title
            - entity_patterns
      additionalProperties: false

    presentations:
      view:
        title: Карта объектов модели

        type: plantuml
        template: templates/od_template.puml
        params:
          type: object
          properties:
            id:
              type: string
          required:
            - id
        origin:
          entities: seaf.toolkit.ds.entities
          objects: seaf.toolkit.ds.objects_with_links
          data_lake: ($)

        source: >
          (                    
          /*  ищем объект-контекст по параметрам которого будем строить схему */          
          $presentation_context := $lookup(data_lake."seaf.toolkit.mm_viewer.obj_diagrams", $params.id);
          $grouping := $presentation_context.grouping;
          $entity_patterns := $presentation_context.entity_patterns;
          $entity_patterns_formats := $presentation_context.entity_patterns_formats;
          $object_patterns_formats := $presentation_context.object_patterns_formats;
          
          $entities_to_show := $entity_patterns~>$map(
              function($p) { $sift(entities, function($v, $k) { $wcard($k, $p) }) }
          )~>$merge();
          
          /* Функция находит строку формата (цвет\стиль) для заданного объекта */
          $get_object_format := function($obj_id, $ent_id) {(
              $o_format := [$map($object_patterns_formats, function($f){(
                  $wcard($obj_id, $f.pattern) ? $f.object_format
              )})];
          
              $e_format := [$map($entity_patterns_formats, function($f){(
                  $wcard($ent_id, $f.pattern) ? $f.object_format
              )})];
              /* возвращаем первое совпадение */
              $append($o_format, $e_format)[0];
          )};
          
          /* Функция находит строку формата (цвет\стиль) для стрелки заданного объекта */
          $get_link_format := function($obj_id, $ent_id) {(
              $o_format := [$map($object_patterns_formats, function($f){(
                  $wcard($obj_id, $f.pattern) ? $f.link_format
              )})];
          
              $e_format := [$map($entity_patterns_formats, function($f){(
                  $wcard($ent_id, $f.pattern) ? $f.link_format
              )})];
              /* возвращаем первое совпадение */
              $append($o_format, $e_format)[0];
          )};
          
          /* Функция находит группу для заданного объекта */
          $get_object_group := function($obj_id, $ent_id) {(
              $o_group := [$map($object_patterns_formats, function($f){(
                  $wcard($obj_id, $f.pattern) ? $f.group
              )})];
              $e_group := [$map($entity_patterns_formats, function($f){(
          
                  $wcard($ent_id, $f.pattern) ? $f.group
              )})];
              /* возвращаем первое совпадение */
              $append($o_group, $e_group)[0];
          )};
          
          /* Формируем исходные данные для визуализации */
          
          $objects_to_show := objects.$sift(function($v, $k) {
              $exists($v.__entity_id__) and $exists($lookup($entities_to_show, $v.__entity_id__)) and $not($v.__entity_id__ = null)
          });
          
          /*  Формируем объект для визуализации */
          {
              "objects": (        
                  $objects_to_show.*~>$map(function($o){(
                      $object_group := $grouping
                          ? $get_object_group($o.__id__, $o.__entity_id__)
                          : "";
                      {
                          "object_id": $o.__id__,
                          "title": $o.body.title,
                          "entity_id": $o.__entity_id__,
                          "entity_title": $o.__entity_title__,
                          "object_format": $get_object_format($o.__id__, $o.__entity_id__),
                          "object_group": $object_group
                      };
                  )})
              ),
              "links": ( 
                  $arr_raw := $each($objects_to_show, function ($val, $obj_id){(
                      $exists($val.links) 
                      ? ($each($val.links, function($link_val, $link_id) {(
                            $link_format := $get_link_format($link_id, $val.__entity_id__);
                            { 
                                "from": $obj_id, 
                                "to": $link_val.to,
                                "link_attr": $link_id, 
                                "link_format": $link_format
                            }
                            )})
                        )    
                    )});
                  /* превращаем массив массивов в плоский массив */
                  $arr_raw@$i.$append($a, $i)
              )          
          }
          )
