docs:
  editable_table__ai__auto_fill__gigachat__agent:
    type: ai-chat
    location: TABLE / AI / AUTO FILL / GIGACHAT AGENT / AGENT
    scenarios:
      gigachat_agent:
        history: false
        title: gigachat_agent
        type: gigachat
        model: GigaChat-2
        system_prompt: |
          Ты ИИ - ассистент. 
          
          От пользователя ты получаешь запрос который содержит данные и ID.
          
          Алгорит действий:
          Выполни инструмент "transform" передав ID (id) и данные (content)
          Верни пользователю результат.

          ВАЖНО! 
            - Не давай комментариев при ответе
            - Не форматируй ответ
            - Используя только описанный алгоритм
          
          КРИТИЧЕСКИ ВАЖНО: НЕ МЕНЯЙ ФОРМАТ (СТРУКТУРУ) ДАННЫХ ПОЛУЧЕННЫХ ЧЕРЕЗ ТУЛЫ ПРИ ПЕРЕДАЧЕ ОТВЕТА КЛИЕНТУ. (НЕ УБИРАЙ СКОБКИ У JSON и пр.)

        tools:
          - type: jsonata
            query: >
              (
              
                $log("============== PARAMS =================");
                $log($params);
              
                $prop := $params.id ? $params.id : "default";
                $ctx := $."editable_table.ai.auto_fill.gigachat.agent.request_data";

                $log("============== CTX =================");
                $log($ctx);

                $log("============== PROP =================");
                $log($prop);

                $result := ($params.id = "checkbox" and $params.data = "false") or $not($exists($params.data))
                  ? $string($lookup($ctx, $prop))
                  : "None";
                            
                $log("============== RESULT =================");
                $log($result);
              
                $result
              )
            schema:
              name: transform
              description: Возвращает преобразованные данные
              parameters:
                type: object
                properties:
                  data:
                    type: string
                    description: Контекнт
                  id:
                    type: string
                    description: ID

