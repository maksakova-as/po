# В данном примере описано использование плагина
# В документе template-export описываем формируемый excel файл с пустыми ячейками
# После сохранения заполняем файл
# В документе template-import указываем имя таблицы из которой забираем данные и JSONata выражение по корому их преобразуем под данные для таблицы и сохраняем
# В документе result-table описываем таблицу для вывода с выгруженными данными

docs:
  template-import-1:
    type: excel-import
    location: Пример использования/Импорт-1-динамическое имя
    yaml:
#      null_replace_string: "тест1"
    tables:
      - name: tableForImport
        output: >
          (
            $name := table[0][1];
            $id := table[0][0];
            $new_path := "result/" & $name & "_" & $id & ".yaml";
            $new_path
                    )
        source: >
          (
            $file := file ? file : {};
            $merge([$file, $])
          )

